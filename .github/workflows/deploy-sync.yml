name: Deploy Mishu Sync Relay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sync-relay/**', '.github/workflows/deploy-sync.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISHU_KV_NAMESPACE_ID: ${{ vars.MISHU_KV_NAMESPACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$MISHU_KV_NAMESPACE_ID" || { echo 'Publisher must set Cloudflare credentials and KV namespace ID'; exit 1; }
          sed -i "s/REPLACE_WITH_YOUR_KV_NAMESPACE_ID/$MISHU_KV_NAMESPACE_ID/" sync-relay/wrangler.toml
          cd sync-relay
          npx --yes wrangler@3 deploy
