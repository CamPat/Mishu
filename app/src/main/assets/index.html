:root{--bg:#f7f4fa;--card:#fff;--ink:#292332;--accent:#9168bb;--line:#c4a8db;--weight:2px;--font:system-ui;--fs:16px;--title:#292332;--subtitle:#5b5265;--entry:#fff;--spacing:10px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs)}header{position:sticky;top:0;z-index:20;background:var(--card);display:flex;align-items:center;gap:8px;padding:10px;box-shadow:0 2px 9px #0001}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;background:#eee7f5;padding:9px 12px;color:var(--ink);cursor:pointer}button.primary{background:var(--accent);color:white}button.icon{padding:8px}header strong{flex:1}main{max-width:920px;margin:auto;padding:14px 14px 90px}.panel,.note,.node{background:var(--card);border-radius:13px;padding:12px;margin:9px 0;box-shadow:0 1px 4px #0001}.note{display:flex;align-items:center;gap:8px}.note .name{flex:1;text-align:left;background:transparent}.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0}.muted{opacity:.65;font-size:.86em}.tree{padding-left:14px}.node{border-left:var(--weight) solid var(--line);margin:6px 0;padding:8px;background:var(--entry)}.node-row{display:flex;gap:6px;align-items:center}.node-row input{min-width:0;flex:1;border:0;background:transparent;padding:7px}.node-content{width:100%;border:0;resize:none;min-height:0;overflow:hidden;display:block;background:transparent;padding:8px;line-height:1.45}.children{margin-left:14px;border-left:var(--weight) solid var(--line);padding-left:var(--spacing)}.hidden{display:none!important}input[type=text],input[type=search],input[type=number],select{border:1px solid #d9d0df;border-radius:8px;padding:8px;max-width:100%}dialog{border:0;border-radius:16px;box-shadow:0 12px 50px #0004;width:min(94vw,650px);max-height:85vh;overflow:auto;padding:18px;background:var(--card);color:var(--ink)}dialog::backdrop{background:#0007}dialog h3{margin-top:0}.settings label{display:flex;justify-content:spa 'use strict';const KEY='mishu_v1',BK='mishu_backups_v1';const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>Date.now();function fresh(){const c=uid(),f=uid();return {schema:1,seq:0,updated:now(),collections:[{id:c,name:'Mi biblioteca'}],folders:[{id:f,collectionId:c,name:'General'}],notes:[],trash:[],style:{},templates:[]}}function valid(x){if(!(x&&x.schema===1&&Number.isSafeInteger(x.seq)&&x.seq>=0&&['collections','folders','notes','trash','templates'].every(k=>Array.isArray(x[k]))))return false;const ids=new Set();for(const n of [...x.notes,...x.trash]){if(!n||typeof n.id!=='string'||ids.has(n.id)||typeof n.title!=='string'||!Array.isArray(n.nodes))return false;ids.add(n.id);const check=(nodes,depth=0)=>depth<80&&nodes.every(v=>v&&typeof v.id==='string'&&typeof v.title==='string'&&typeof v.content==='string'&&Array.isArray(v.children)&&check(v.children,depth+1));if(!check(n.nodes))return false;}return true}let db;function load(){let arr=[];for(const k of [KEY,BK])try{let x=JSON.parse(localStorage.getItem(k)||'null');if(k===BK&&Array.isArray(x))arr.push(...x);else if(x)arr.push(x)}catch{}arr=arr.filter(valid).sort((a,b)=>b.seq-a.seq||b.updated-a.updated);db=arr[0]||fresh();if(!db.collections.length){let n=fresh();db.collections=n.collections;db.folders=n.folders}if(!db.folders.length)db.folders=[{id:uid(),collectionId:db.collections[0].id,name:'General'}];db.style??={};applyStyle();if(!arr.length&&!window.MishuNative)save()}function save(){db.seq++;db.updated=now();try{let old=localStorage.getItem(KEY);let backups=JSON.parse(localStorage.getItem(BK)||'[]');if(old){let prev=JSON.parse(old);if(valid(prev)&&!backups.some(x=>x.seq===prev.seq))backups.push(prev)}backups=backups.slice(-4);localStorage.setItem(BK,JSON.stringify(backups));localStorage.setItem(KEY,JSON.stringify(db));if(window.MishuNative)window.MishuNative.save(JSON.stringify(db));if(window.pywebview?.api?.save)window.pywebview.api.save(JSON.stringify(db)).catch(e=>console.error('Windows save',e))}catch(e){alert('No se pudo guardar: '+e.message)}}function nativeRestore(s){try{const x=JSON.parse(s);if(!valid(x))throw Error('Estado nativo inválido');if(x.seq>=db.seq){db=x;localStorage.setItem(KEY,JSON.stringify(db));applyStyle();render()}window.mishuNativeReady=true;}catch(e){console.error(e);alert('No se pudo recuperar la biblioteca: '+e.message)}}window.mishuNativeRestore=nativeRestore;
let current=null,folder=null,collection=null,history=[],future=[],study=false,selectionText='',selectionNode=null,selectionStart=0,selectionEnd=0;const findNote=id=>db.notes.find(n=>n.id===id);const allNodes=ns=>ns.flatMap(n=>[n,...allNodes(n.children||[])]);function findNode(nodes,id){for(const n of nodes){if(n.id===id)return n;const a=findNode(n.children||[],id);if(a)return a}return null}let undoStack=[],redoStack=[];
function mutate(f){if(current)flushEdits();undoStack.push(JSON.stringify(db));if(undoStack.length>35)undoStack.shift();redoStack=[];f();save();render()}
function undoEdit(){if(study)return;if(!undoStack.length)return;flushEdits();redoStack.push(JSON.stringify(db));db=JSON.parse(undoStack.pop());save();render()}
function redoEdit(){if(study)return;if(!redoStack.length)return;flushEdits();undoStack.push(JSON.stringify(db));db=JSON.parse(redoStack.pop());save();render()}
function goto(id,record=true){if(current)flushEdits();if(id&&!findNote(id))return alert('Esta nota ya no existe');if(record){history.push(current);future=[]}current=id;hidePop();render();window.scrollTo(0,0)}function back(){if(current)flushEdits();if(!history.length)return;future.push(current);current=history.pop();render()}function forward(){if(current)flushEdits();if(!future.length)return;history.push(current);current=future.pop();render()}function modal(html){$('modal').innerHTML=html;$('modal').showModal()}function closeModal(){$('modal').close()}function ask(title,value,cb){modal(`<h3>${esc(title)}</h3><form method="dialog" id="askForm"><input id="askValue" type="text" value="${esc(value)}" required style="width:100%"><div class="toolbar"><button type="button" onclick="closeModal()">Cancelar</button><button class="primary">Guardar</button></div></form>`);$('askForm').onsubmit=e=>{e.preventDefault();const v=$('askValue').value.trim();if(v){closeModal();cb(v)}}}function hidePop(){$('popover').classList.add('hidden')}function positionPopover(anchor){const p=$('popover');if(!anchor)return;const r=anchor.getBoundingClientRect();p.style.transform='none';p.style.width='min(290px, calc(100vw - 16px))';p.style.maxHeight='min(70vh, 480px)';p.style.overflowY='auto';const w=p.getBoundingClientRect().width;let x=r.left;if(x+w>innerWidth-8)x=Math.max(8,innerWidth-w-8);if(x<8)x=8;let y=r.bottom+5;const h=p.getBoundingClientRect().height;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-5);if(y<8)y=8;p.style.left=x+'px';p.style.top=y+'px'}function pop(html,anchor){$('popover').removeAttribute('style');$('popover').innerHTML=html;$('popover').classList.remove('hidden');positionPopover(anchor||document.activeElement)};document.addEventListener('pointerdown',e=>{if(!e.target.closest('#popover,#optBtn,#navBtn'))hidePop();if(!e.target.closest('#selectionBar,.node-content'))hideSelectionBar()});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
function renameCurrentNote(){if(study)return;const n=findNote(current);if(n)ask('Título de nota',n.title,v=>mutate(()=>n.title=v))}function render(){let out='';if(current){let n=findNote(current);if(!n){current=null;return render()}out=`<div class="breadcrumbs"><button onclick="goto(null)">Biblioteca</button> / ${esc(n.title)}</div><div class="toolbar">${study?'':`<button onclick="renameCurrentNote()">✎ Título</button><button onclick="addRoot()">＋ Tema</button><button onclick="undoEdit()" title="Deshacer">↶</button><button onclick="redoEdit()" title="Rehacer">↷</button>`}<button onclick="flushEdits();study=!study;hideSelectionBar();render()">${study?'Salir del estudio':'Modo estudio'}</button><button onclick="exportPDF()">PDF</button>${study?'':`<button onclick="noteActions('${n.id}',this)">⋯</button>`}</div><div id="nodes">${renderNodes(n.nodes||[],n.id)}</div>${!(n.nodes||[]).length?'<div class="empty">Añade tu primer tema.</div>':''}`}else{out=`<div class="toolbar"><button class="primary" onclick="createNote()">＋ Nota</button><button onclick="newFolder()">＋ Carpeta</button><button onclick="newCollection()">＋ Colección</button><button onclick="openTrash()">Papelera (${db.trash.length})</button></div>`;for(const c of db.collections){out+=`<section class="panel"><div class="toolbar"><b>${esc(c.name)}</b><button onclick="renameCollection('${c.id}')">✎</button>${c.id!==db.collections[0].id?`<button onclick="deleteCollection('${c.id}')">🗑</button>`:''}</div>`;for(const f of db.folders.filter(x=>x.collectionId===c.id)){out+=`<div class="panel"><div class="toolbar"><b>▣ ${esc(f.name)}</b><button onclick="renameFolder('${f.id}')">✎</button>${f.id!==db.folders[0].id?`<button onclick="deleteFolder('${f.id}')">🗑</button>`:''}</div>`;for(const n of db.notes.filter(x=>x.folderId===f.id)){out+=`<div class="note"><button onclick="noteActions('${n.id}',this)">⋯</button><button class="name" onclick="goto('${n.id}')">📄 ${esc(n.title)}</button><span class="muted">${new Date(n.updated||now()).toLocaleDateString()}</span></div>`}out+='</div>'}out+='</section>'}if(!db.notes.length)out+='<div class="empty">Tu biblioteca está lista. Crea tu primera nota.</div>'}$('main').innerHTML=out;}
function autoSizeEntry(el){if(!el)return;el.style.height="auto";el.style.height=Math.max(28,el.scrollHeight)+"px"}function sizeAllEntries(){document.querySelectorAll("textarea.node-content").forEach(autoSizeEntry)}
function renderNodes(nodes,noteId){return nodes.map(n=>`<div class="node" data-node="${n.id}"><div class="node-row"><button class="icon" onclick="toggleNode('${n.id}')">${n.open===false?'+':'−'}</button><input aria-label="Título de tema" ${study?'readonly tabindex="-1"':''} value="${esc(n.title)}" onchange="editNode('${n.id}','title',this.value)">${study?'':`<button onclick="nodeActions('${n.id}',this)">⋯</button>`}</div><div class="${n.open===false?'hidden':''}"><textarea class="node-content" ${study?'readonly':''} aria-label="Contenido" oninput="autoSizeEntry(this);debouncedEdit('${n.id}',this.value)" onmouseup="captureSelection(this)" onkeyup="captureSelection(this)" onselect="captureSelection(this)">${esc(study?n.content.replace(/\{\{(.*?)\}\}/g,'████'):n.content)}</textarea>${study?'':`<div class="toolbar"><button onclick="addChild('${n.id}')">＋ Subtema</button><button onclick="textTools('${n.id}')">Seleccionar / herramientas</button></div>`}${n.media?.length?`<div class="media">${n.media.map(renderMedia).join('')}</div>`:''}<div class="children">${renderNodes(n.children||[],noteId)}</div></div></div>`).join('')}
function mediaURL(raw,type){try{let u=new URL(raw);if(u.protocol!=='https:')return '';if(u.hostname==='drive.google.com'){let match=u.pathname.match(/\/file\/d\/([\w-]+)/);let id=match?.[1]||u.searchParams.get('id');if(id)return type==='image'?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1200':'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview'}return u.href}catch{return ''}}function renderMedia(m){let u=esc(mediaURL(m.url,m.type)||m.url),t=m.type;if(t==='image')return `<div><img src="${u}" onclick="previewMedia('${esc(m.id)}')" onerror="this.outerHTML='Imagen no disponible: <a href=&quot;${u}&quot;>abrir enlace</a>'"></div>`;if(t==='audio')return `<audio controls src="${u}"></audio>`;if(t==='video')return `<div><button onclick="previewMedia('${esc(m.id)}')">▶ Ampliar video</button></div>`;return `<a target="_blank" rel="noopener" href="${u}">Abrir archivo</a>`}function locate(id){const note=findNote(current);return note&&findNode(note.nodes,id)}function editNode(id,key,value){if(study)return;const n=locate(id);if(n)mutate(()=>{n[key]=value;findNote(current).updated=now()})}let editTimers={};function debouncedEdit(id,value){if(study)return;clearTimeout(editTimers[id]);editTimers[id]=setTimeout(()=>{const n=locate(id);if(n){n.content=value;findNote(current).updated=now();save()}},350)}function flushEdits(){for(const el of document.querySelectorAll('.node[data-node]')){let n=locate(el.dataset.node),ta=el.querySelector('textarea');if(n&&ta&& !study)n.content=ta.value}Object.values(editTimers).forEach(clearTimeout);editTimers={};save()}function node(){return {id:uid(),title:'Nuevo tema',content:'',children:[],open:true,media:[]}}function addRoot(){if(study)return;mutate(()=>findNote(current).nodes.push(node()))}function addChild(id){if(study)return;mutate(()=>locate(id).children.push(node()))}function toggleNode(id){mutate(()=>locate(id).open=locate(id).open===false?true:false)}function siblings(id,nodes){for(let i=0;i<nodes.length;i++){if(nodes[i].id===id)return {nodes,i};const a=siblings(id,nodes[i].children||[]);if(a)return a}return null}function nodeActions(id,anchor){pop(`<button onclick="moveNode('${id}',-1)">↑ Subir</button><button onclick="moveNode('${id}',1)">↓ Bajar</button><button onclick="indentNode('${id}')">→ Jerarquizar más</button><button onclick="outdentNode('${id}')">← Jerarquizar menos</button><button onclick="duplicateNode('${id}')">Duplicar</button><button onclick="attachMedia('${id}')">Vincular multimedia</button><button onclick="removeNode('${id}')">Eliminar</button>`,anchor)}function moveNode(id,d){if(study)return;mutate(()=>{let s=siblings(id,findNote(current).nodes);if(s){let j=s.i+d;if(j>=0&&j<s.nodes.length)[s.nodes[s.i],s.nodes[j]]=[s.nodes[j],s.nodes[s.i]]}})}function indentNode(id){if(study)return;mutate(()=>{let s=siblings(id,findNote(current).nodes);if(s&&s.i>0)s.nodes[s.i-1].children.push(...s.nodes.splice(s.i,1))})}function outdentNode(id){if(study)return;mutate(()=>{let root=findNote(current).nodes;function walk(ns,parent){for(let i=0;i<ns.length;i++){if(ns[i].id===id&&parent){let p=siblings(parent.id,root);if(p){p.nodes.splice(p.i+1,0,...ns.splice(i,1));return true}}if(walk(ns[i].children||[],ns[i]))return true}return false}walk(root,null)})}function duplicateNode(id){if(study)return;mutate(()=>{let s=siblings(id,findNote(current).nodes);if(s){let copy=JSON.parse(JSON.stringify(s.nodes[s.i]));function reset(n){n.id=uid();n.children.forEach(reset);(n.media||[]).forEach(m=>m.id=uid())}reset(copy);s.nodes.splice(s.i+1,0,copy)}})}function removeNode(id){if(study)return;if(confirm('¿Eliminar este tema y todos sus subtemas?'))mutate(()=>{let s=siblings(id,findNote(current).nodes);if(s)s.nodes.splice(s.i,1)})}
function createNote(){ask('Nombre de la nota','',v=>{let f=folder||db.folders[0].id;const n={id:uid(),folderId:f,title:v,nodes:[],created:now(),updated:now()};mutate(()=>db.notes.push(n));goto(n.id)})}function newCollection(){ask('Nombre de colección','',v=>mutate(()=>{let id=uid();db.collections.push({id,name:v});db.folders.push({id:uid(),collectionId:id,name:'General'})}))}function newFolder(){let opts=db.collections.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');modal(`<h3>Nueva carpeta</h3><input id="fname" placeholder="Nombre"><select id="fcollection">${opts}</select><div class="toolbar"><button onclick="closeModal()">Cancelar</button><button onclick="finishFolder()">Crear</button></div>`)}function finishFolder(){let v=$('fname').value.trim();if(!v)return;mutate(()=>db.folders.push({id:uid(),name:v,collectionId:$('fcollection').value}));closeModal()}function renameCollection(id){let c=db.collections.find(x=>x.id===id);ask('Renombrar colección',c.name,v=>mutate(()=>c.name=v))}function renameFolder(id){let f=db.folders.find(x=>x.id===id);ask('Renombrar carpeta',f.name,v=>mutate(()=>f.name=v))}function deleteFolder(id){if(!confirm('¿Eliminar carpeta y enviar sus notas a papelera?'))return;mutate(()=>{db.trash.push(...db.notes.filter(n=>n.folderId===id));db.notes=db.notes.filter(n=>n.folderId!==id);db.folders=db.folders.filter(f=>f.id!==id)})}function deleteCollection(id){if(!confirm('¿Eliminar colección y enviar sus notas a papelera?'))return;mutate(()=>{let ids=db.folders.filter(f=>f.collectionId===id).map(f=>f.id);db.trash.push(...db.notes.filter(n=>ids.includes(n.folderId)));db.notes=db.notes.filter(n=>!ids.includes(n.folderId));db.folders=db.folders.filter(f=>f.collectionId!==id);db.collections=db.collections.filter(c=>c.id!==id)})}function noteActions(id,anchor){pop(`<button onclick="duplicateNote('${id}')">Duplicar nota</button><button onclick="moveNote('${id}')">Mover nota</button><button onclick="saveTemplate('${id}')">Guardar como molde</button><button onclick="deleteNote('${id}')">Enviar a papelera</button>`,anchor)}function duplicateNote(id){mutate(()=>{let n=structuredClone(findNote(id));n.id=uid();n.title+=' (copia)';n.nodes.forEach(function fix(x){x.id=uid();x.children.forEach(fix)});db.notes.push(n)})}function moveNote(id){modal(`<h3>Mover nota</h3><select id="dest">${db.folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select><button onclick="mutate(()=>findNote('${id}').folderId=$('dest').value);closeModal()">Mover</button>`)}function deleteNote(id){if(!confirm('¿Enviar a papelera?'))return;mutate(()=>{db.trash.push(findNote(id));db.notes=db.notes.filter(n=>n.id!==id)});if(current===id)goto(null)}function openTrash(){modal(`<h3>Papelera</h3>${db.trash.map(n=>`<div class="result">${esc(n.title)} <button onclick="restoreNote('${n.id}')">Restaurar</button><button onclick="purgeNote('${n.id}')">Eliminar definitivamente</button></div>`).join('')||'Vacía'}<button onclick="closeModal()">Cerrar</button>`)}function restoreNote(id){mutate(()=>{let n=db.trash.find(n=>n.id===id);if(n){if(!db.folders.some(f=>f.id===n.folderId))n.folderId=db.folders[0].id;db.notes.push(n);db.trash=db.trash.filter(n=>n.id!==id)}});openTrash()}function purgeNote(id){if(confirm('Esta acción es irreversible.')){mutate(()=>db.trash=db.trash.filter(n=>n.id!==id));openTrash()}}
function search(query){let q=query.trim().toLocaleLowerCase();if(!q)return [];return db.notes.map(n=>{let title=n.title.toLocaleLowerCase(),content=allNodes(n.nodes).map(x=>x.title+' '+x.content).join(' ').toLocaleLowerCase();let score=title===q?0:title.includes(q)?1:content.includes(q)?2:9;return {n,score}}).filter(x=>x.score<9).sort((a,b)=>a.score-b.score)}function searchUI(q=''){modal(`<h3>Buscar en la biblioteca</h3><input id="searchInput" type="search" placeholder="Palabras o título" value="${esc(q)}" style="width:100%" oninput="showResults(this.value)"><div id="results"></div><button onclick="closeModal()">Cerrar</button>`);showResults(q)}function showResults(q){$('results').innerHTML=search(q).map(({n,score})=>`<div class="result"><button onclick="previewNote('${n.id}')">${score===0?'★ ':''}${esc(n.title)} <span class="muted">${score<2?'Título':'Contenido'}</span></button></div>`).join('')||'<p class="muted">Sin resultados</p>'}function previewNote(id){const n=findNote(id);if(!n)return;modal(`<h3>${esc(n.title)}</h3><div>${allNodes(n.nodes).map(x=>`<div class="panel"><b>${esc(x.title)}</b><p style="white-space:pre-wrap">${esc(x.content)}</p></div>`).join('')}</div><div class="toolbar"><button onclick="closeModal()">Cerrar</button><button onclick="closeModal();goto('${id}')">Abrir nota</button></div>`)}function captureSelection(el){if(!el||!el.classList.contains('node-content'))return;const a=el.selectionStart,b=el.selectionEnd;selectionText=el.value.substring(a,b);selectionNode=el.closest('[data-node]')?.dataset.node||null;selectionStart=a;selectionEnd=b;const bar=$('selectionBar');if(!selectionText.trim()){hideSelectionBar();return;}bar.classList.remove('hidden');$('selectionMaskBtn').classList.toggle('hidden',study);bar.style.visibility='hidden';const r=el.getBoundingClientRect(),w=bar.offsetWidth,h=bar.offsetHeight;let x=Math.max(8,Math.min(innerWidth-w-8,r.left+Math.min(r.width/2,w/2)-w/2));let y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);bar.style.left=x+'px';bar.style.top=y+'px';bar.style.visibility='visible'}
function hideSelectionBar(){$('selectionBar').classList.add('hidden')}function openRelations(){if(!selectionText.trim())return;const q=selectionText.trim();hideSelectionBar();relationUI(q)}function relationUI(q){const matches=search(q);modal(`<h3>Relaciones con «${esc(q)}»</h3><p class=muted>Primero coincidencias exactas en el título; después coincidencias parciales y menciones en el contenido.</p><div class=relation-list>${matches.map(({n,score})=>`<div class=result><button onclick="previewRelation('${n.id}')"><b>${esc(n.title)}</b> · ${score===0?'Título exacto':score===1?'Título relacionado':'Mención en contenido'}</button>${score===2?`<div class=relationship-context>${esc(contextSnippet(n,q))}</div>`:''}</div>`).join('')||'<p>No se encontraron relaciones.</p>'}</div><button onclick="closeModal()">Cerrar</button>`)}function contextSnippet(n,q){let t=allNodes(n.nodes||[]).map(x=>x.title+' — '+x.content).join(' · '),i=t.toLocaleLowerCase().indexOf(q.toLocaleLowerCase());return i<0?'':t.slice(Math.max(0,i-65),i+q.length+110)}function previewRelation(id){let n=findNote(id);if(!n)return;modal(`<h3>${esc(n.title)}</h3><p class=muted>Vista flotante · no sales de tu nota original</p><div class=preview-scroll>${(function draw(ns,d=0){return ns.map(x=>`<section class=panel style="margin-left:${Math.min(d,8)*12}px"><b>${esc(x.title)}</b><p style="white-space:pre-wrap">${esc(x.content)}</p>${draw(x.children||[],d+1)}</section>`).join('')})(n.nodes||[])||'<p>Nota vacía</p>'}</div><button onclick="relationUI(selectionText)">← Resultados</button><button onclick="closeModal()">Cerrar</button>`)}function replaceSelected(replacement){if(study)return;if(!selectionNode||!selectionText)return;let n=locate(selectionNode);if(!n)return;let original=n.content||'';if(original.slice(selectionStart,selectionEnd)!==selectionText)return alert('La selección cambió. Selecciónala nuevamente.');mutate(()=>{n.content=original.slice(0,selectionStart)+replacement+original.slice(selectionEnd)});hideSelectionBar()}function formatSelection(type){if(study)return;let t=selectionText;if(!t)return;replaceSelected(type==='bold'?'**'+t+'**':type==='italic'?'*'+t+'*':'<u>'+t+'</u>')}function hideSelected(){if(study)return;if(selectionText)replaceSelected('{{'+selectionText+'}}')}function attachSelected(){if(selectionNode){let id=selectionNode;hideSelectionBar();attachMedia(id)}}function textTools(id){const n=locate(id);let text=selectionText||'';modal(`<h3>Herramientas de texto</h3><p class="muted">${esc(text||'Selecciona primero una palabra o frase en el contenido.')}</p><div class="toolbar"><button onclick="closeModal();relationUI(${JSON.stringify(text)})">Buscar relaciones</button><button onclick="closeModal();attachMedia('${id}')">Vincular archivo externo</button><button onclick="maskText('${id}')">Ocultar en modo estudio</button></div><button onclick="closeModal()">Cerrar</button>`)}function maskText(id){if(study)return;let t=selectionText;if(!t)return alert('Selecciona texto primero');mutate(()=>{let n=locate(id);n.content=n.content.replace(t,'{{'+t+'}}')});closeModal()}function attachMedia(id){if(study)return;modal(`<h3>Enlazar multimedia</h3><select id="mtype"><option value="image">Imagen</option><option value="audio">Audio</option><option value="video">Video</option><option value="link">Otro enlace</option></select><input id="murl" placeholder="https://..." style="width:100%;margin-top:12px"><div class="toolbar"><button onclick="closeModal()">Cancelar</button><button onclick="finishMedia('${id}')">Añadir</button></div>`)}function finishMedia(id){if(study)return;let url=$('murl').value.trim();if(!/^https:\/\//i.test(url))return alert('Usa un enlace HTTPS');let type=$('mtype').value;mutate(()=>{let n=locate(id);n.media??=[];n.media.push({id:uid(),url,type})});closeModal()}function previewMedia(id){let m=null;for(let n of db.notes)for(let x of allNodes(n.nodes)){m=(x.media||[]).find(a=>a.id===id);if(m)break;if(m)break}if(!m)return;let url=esc(mediaURL(m.url,m.type)||m.url);modal(`<h3>Vista ampliada</h3>${m.type==='image'?`<img style="max-width:100%" src="${url}">`:m.type==='video'?`<iframe style="width:100%;height:55vh" src="${url}" allowfullscreen></iframe>`:''}<p><a target="_blank" rel="noopener" href="${url}">Abrir enlace externo</a></p><button onclick="closeModal()">Cerrar</button>`)}
function saveTemplate(id){ask('Nombre del molde',findNote(id).title,v=>mutate(()=>db.templates.push({id:uid(),name:v,nodes:structuredClone(findNote(id).nodes)})))}function templateUI(){modal(`<h3>Moldes</h3>${db.templates.map(t=>`<div class="result">${esc(t.name)} <button onclick="useTemplate('${t.id}')">Crear nota</button><button onclick="removeTemplate('${t.id}')">Eliminar</button></div>`).join('')||'Sin moldes'}<button onclick="closeModal()">Cerrar</button>`)}function useTemplate(id){let t=db.templates.find(t=>t.id===id);if(!t)return;let nodes=structuredClone(t.nodes);function fix(n){n.id=uid();n.children.forEach(fix)}nodes.forEach(fix);let n={id:uid(),folderId:db.folders[0].id,title:t.name,nodes,created:now(),updated:now()};mutate(()=>db.notes.push(n));closeModal();goto(n.id)}function removeTemplate(id){mutate(()=>db.templates=db.templates.filter(t=>t.id!==id));templateUI()}
function applyStyle(){let s=db.style||{};for(let [k,v] of Object.entries({'--bg':s.bg||'#f7f4fa','--card':s.card||'#ffffff','--ink':s.ink||'#292332','--accent':s.accent||'#9168bb','--line':s.line||'#c4a8db','--weight':(s.weight||2)+'px','--font':s.font||'system-ui','--fs':(s.fs||16)+'px','--title':s.title||'#292332','--subtitle':s.subtitle||'#5b5265','--entry':s.entry||'#ffffff','--spacing':(s.spacing||10)+'px'}))document.documentElement.style.setProperty(k,v);document.body.dataset.pattern=s.pattern||'solid';document.querySelectorAll('.children').forEach(el=>el.style.borderStyle=s.pattern==='dotted'?'dotted':s.pattern==='dashed'?'dashed':'solid')}function styleUI(){let s=db.style;modal(`<h3>Editor de estilo</h3><div class="settings">${[['bg','Fondo general'],['card','Fondo de notas'],['entry','Fondo de entradas'],['ink','Texto predeterminado'],['title','Color de títulos'],['subtitle','Color de subtítulos'],['accent','Controles'],['line','Líneas']].map(([k,l])=>`<label>${l}<input type="color" value="${esc(s[k]||({bg:'#f7f4fa',card:'#ffffff',ink:'#292332',accent:'#9168bb',line:'#c4a8db',entry:'#ffffff',title:'#292332',subtitle:'#5b5265'}[k]))}" onchange="setStyle('${k}',this.value)"></label>`).join('')}<label>Fuente <select id="mishuFontSelector" onchange="setStyle('font',this.value)"><option value="system-ui">Sistema</option><option value="Arial">Arial</option><option value="&quot;Comic Sans MS&quot;, &quot;Comic Sans&quot;, cursive">Comic Sans</option><option value="Verdana">Verdana</option><option value="Tahoma">Tahoma</option><option value="Trebuchet MS">Trebuchet MS</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option><option value="Palatino Linotype">Palatino</option><option value="Garamond">Garamond</option><option value="Courier New">Courier New</option><option value="Lucida Console">Lucida Console</option><option value="Impact">Impact</option><option value="serif">Serif</option><option value="sans-serif">Sans Serif</option><option value="monospace">Monospace</option><option value="cursive">Cursiva</option></select></label><label>Tamaño <input type="number" min="12" max="28" value="${s.fs||16}" onchange="setStyle('fs',+this.value)"></label><label>Grosor de líneas <input type="number" min="1" max="12" value="${s.weight||2}" onchange="setStyle('weight',+this.value)"></label><label>Separación de líneas <input type="number" min="2" max="40" value="${s.spacing||10}" onchange="setStyle('spacing',+this.value)"></label><label>Patrón <select onchange="setStyle('pattern',this.value)"><option value="solid">Continua</option><option value="dashed">Discontinua</option><option value="dotted">Puntos</option><option value="alternating">Intercalada</option><option value="hearts">Corazoncitos</option></select></label></div><div class="toolbar"><button onclick="mutate(()=>db.style={});closeModal()">Restablecer</button><button onclick="closeModal()">Cerrar</button></div>`)}function syncMishuFontSelector(){const el=document.getElementById('mishuFontSelector');if(el)el.value=(db.style&&db.style.font)||'system-ui'}
function setStyle(k,v){db.style[k]=v;applyStyle();save()}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'Mishu_backup_'+new Date().toISOString().slice(0,10)+'.json')}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}function importBackup(){modal('<h3>Importar copia de seguridad</h3><p>Se reemplazará la biblioteca actual después de validar la copia. Exporta una copia antes.</p><input type="file" id="backupFile" accept=".json,application/json"><button onclick="doImport()">Importar</button><button onclick="closeModal()">Cancelar</button>')}async function doImport(){let f=$('backupFile').files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!valid(x))throw Error('Formato no compatible');if(!confirm('¿Reemplazar la biblioteca actual?'))return;exportBackup();db=x;save();closeModal();render()}catch(e){alert('Error al importar: '+e.message)}}function exportPDF(){modal(`<h3>Exportar a PDF</h3><label><input type=checkbox id=pdfStyle checked> Conservar colores, fuente y estilo</label><div class=toolbar><button onclick="printNotePDF($('pdfStyle').checked)">Preparar PDF</button><button onclick="closeModal()">Cancelar</button></div>`)}function printNotePDF(keepStyle){closeModal();const n=findNote(current);if(!n)return;const w=window.open('','_blank');if(!w)return alert('Permite ventanas emergentes para imprimir PDF');const style=db.style||{};const walk=(nodes,depth=0)=>nodes.map(x=>`<section style="margin-left:${Math.min(depth,12)*15}px;break-inside:avoid-page"><h3 style="font-size:${Math.max(12,21-depth*2)}px;color:${keepStyle?esc(style.title||'#292332'):'#000'}">${esc(x.title)}</h3><p style="white-space:pre-wrap;line-height:1.5">${esc(x.content)}</p>${walk(x.children||[],depth+1)}</section>`).join('');w.document.write(`<html><head><meta charset="utf-8"><title>${esc(n.title)}</title><style>@page{size:A4;margin:18mm}body{font-family:${keepStyle?esc(style.font||'Arial'):'Arial'};color:${keepStyle?esc(style.ink||'#292332'):'#000'};background:${keepStyle?esc(style.bg||'#fff'):'#fff'};padding:8px}h3{break-after:avoid}p{overflow-wrap:anywhere}.pdf-actions{position:sticky;top:0;background:white;padding:10px;text-align:right;border-bottom:1px solid #ddd}.pdf-actions button{padding:10px 15px;border:0;border-radius:8px;background:#eee7f5;cursor:pointer}@media print{.pdf-actions{display:none}}</style></head><body><div class="pdf-actions"><button onclick="window.print()">Exportar / guardar PDF</button></div><h1>${esc(n.title)}</h1>${walk(n.nodes||[])}</body></html>`);w.document.close();w.focus();/* La exportación se inicia desde el botón de la vista previa. */}
function languageUI(){modal(`<h3>Idioma / Language</h3><select id=langSelect><option value=es>Español</option><option value=en>English</option></select><button onclick="setLanguage($('langSelect').value)">Guardar</button>`);$('langSelect').value=db.language||'es'}function setLanguage(l){db.language=l;save();closeModal();render();translateUI();updateStudyGreeting()}function recoverBackup(){let copies=[];try{copies=JSON.parse(localStorage.getItem(BK)||'[]').filter(valid).sort((a,b)=>b.seq-a.seq)}catch{}modal(`<h3>Recuperar copia automática</h3><p>La recuperación reemplazará el estado actual. Exporta antes una copia manual.</p>${copies.map((x,i)=>`<div class=result>Versión ${x.seq} · ${new Date(x.updated).toLocaleString()} · ${x.notes.length} notas <button onclick="restoreCopy(${i})">Restaurar</button></div>`).join('')||'<p>No hay copias recuperables.</p>'}<button onclick="closeModal()">Cerrar</button>`);window._recoveryCopies=copies}
function restoreCopy(i){const x=window._recoveryCopies?.[i];if(!valid(x)||!confirm('¿Restaurar esta copia?'))return;exportBackup();db=structuredClone(x);save();closeModal();goto(null)}
function diagnostics(){modal(`<h3>Diagnóstico</h3><p>Notas: ${db.notes.length}</p><p>Secuencia de guardado: ${db.seq}</p><p>Última escritura: ${new Date(db.updated).toLocaleString()}</p><p>Copias automáticas: ${JSON.parse(localStorage.getItem(BK)||'[]').length}</p><button onclick="closeModal()">Cerrar</button>`)}

const uiTranslations={'Biblioteca':'Library','Nueva nota':'New note','Nueva carpeta':'New folder','Moldes':'Templates','Papelera':'Trash','Editor de estilo':'Style editor','Exportar backup':'Export backup','Importar backup':'Import backup','Diagnóstico':'Diagnostics','Restaurar copia automática':'Restore automatic backup','Idioma / Language':'Language','Crear':'Create','Cerrar':'Close','Cancelar':'Cancel','Buscar relaciones':'Find relationships','Modo estudio':'Study mode','Salir del estudio':'Exit study mode','Seleccionar / herramientas':'Select / tools','Subtema':'Subtopic','Título':'Title','Subir':'Move up','Bajar':'Move down','Duplicar':'Duplicate','Eliminar':'Delete','Mover nota':'Move note','Guardar como molde':'Save as template','Enviar a papelera':'Move to trash','Conservar colores, fuente y estilo':'Keep colors, font and style','Preparar PDF':'Prepare PDF','Buscar':'Search','Restaurar':'Restore','Restablecer':'Reset','Ocultar en estudio':'Hide in study mode','Vincular externo':'Attach external link','Añadir':'Add','Fondo general':'App background','Fondo de notas':'Note background','Fondo de entradas':'Entry background','Texto predeterminado':'Default text','Color de títulos':'Title color','Color de subtítulos':'Subtitle color','Controles':'Controls','Líneas':'Lines','Fuente':'Font','Tamaño':'Font size','Grosor de líneas':'Line thickness','Patrón':'Pattern','Separación de líneas':'Line spacing'};
function updateStudyGreeting(){const el=$('studyGreeting');if(el)el.textContent=db?.language==='en'?"Let\'s study!":"¡Vamos a estudiar!"}function translateUI(){document.documentElement.lang=db.language||'es';if(db.language!=='en')return;for(const root of [$('main'),$('modal'),$('popover'),$('selectionBar')]){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(n.parentElement.closest('textarea,input,.node-content,.node-row input,.name,.breadcrumbs'))continue;let t=n.nodeValue,trim=t.trim();if(uiTranslations[trim])n.nodeValue=t.replace(trim,uiTranslations[trim]);}}}
const oldRender=render;render=function(){oldRender();translateUI();sizeAllEntries()};
const oldModal=modal;modal=function(html){oldModal(html);translateUI()};
const oldPop=pop;pop=function(html){oldPop(html);translateUI()};
window.addEventListener('pywebviewready',async()=>{try{let state=await window.pywebview.api.restore();if(state)nativeRestore(state)}catch(e){console.error('Windows recovery',e)}});

$('navBtn').onclick=()=>pop(`<button onclick="hidePop();goto(null)">Biblioteca</button><button onclick="hidePop();createNote()">Nueva nota</button><button onclick="hidePop();newFolder()">Nueva carpeta</button><button onclick="hidePop();templateUI()">Moldes</button><button onclick="hidePop();openTrash()">Papelera</button>`);$('optBtn').onclick=()=>pop(`<button onclick="hidePop();styleUI()">Editor de estilo</button><button onclick="hidePop();exportBackup()">Exportar backup</button><button onclick="hidePop();importBackup()">Importar backup</button><button onclick="hidePop();diagnostics()">Diagnóstico</button><button onclick="hidePop();recoverBackup()">Restaurar copia automática</button><button onclick="hidePop();languageUI()">Idioma / Language</button>`);$('backBtn').onclick=back;$('forwardBtn').onclick=forward;$('searchBtn').onclick=()=>searchUI();window.addEventListener('beforeunload',()=>{if(current)flushEdits()});load();render();updateStudyGreeting();
</script></body></html>
