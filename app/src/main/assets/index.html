'use strict';const KEY='mishu_v1',BK='mishu_backups_v1';const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>Date.now();function fresh(){const c=uid(),f=uid();return {schema:1,seq:0,updated:now(),collections:[{id:c,name:'Mi biblioteca'}],folders:[{id:f,collectionId:c,name:'General'}],notes:[],trash:[],style:{},templates:[]}}function valid(x){if(!(x&&x.schema===1&&Number.isSafeInteger(x.seq)&&x.seq>=0&&['collections','folders','notes','trash','templates'].every(k=>Array.isArray(x[k]))))return false;const ids=new Set();for(const n of [...x.notes,...x.trash]){if(!n||typeof n.id!=='string'||ids.has(n.id)||typeof n.title!=='string'||!Array.isArray(n.nodes))return false;ids.add(n.id);const check=(nodes,depth=0)=>depth<80&&nodes.every(v=>v&&typeof v.id==='string'&&typeof v.title==='string'&&typeof v.content==='string'&&Array.isArray(v.children)&&check(v.children,depth+1));if(!check(n.nodes))return false;}return true}let db;function load(){let arr=[];for(const k of [KEY,BK])try{let x=JSON.parse(localStorage.getItem(k)||'null');if(k===BK&&Array.isArray(x))arr.push(...x);else if(x)arr.push(x)}catch{}arr=arr.filter(valid).sort((a,b)=>b.seq-a.seq||b.updated-a.updated);db=arr[0]||fresh();if(!db.collections.length){let n=fresh();db.collections=n.collections;db.folders=n.folders}if(!db.folders.length)db.folders=[{id:uid(),collectionId:db.collections[0].id,name:'General'}];db.style??={};if(migrateLegacyMasks())save();applyStyle();if(!arr.length&&!window.MishuNative)save()}function save(){db.seq++;db.updated=now();try{let old=localStorage.getItem(KEY);let backups=JSON.parse(localStorage.getItem(BK)||'[]');if(old){let prev=JSON.parse(old);if(valid(prev)&&!backups.some(x=>x.seq===prev.seq))backups.push(prev)}backups=backups.slice(-4);localStorage.setItem(BK,JSON.stringify(backups));localStorage.setItem(KEY,JSON.stringify(db));if(window.MishuNative)window.MishuNative.save(JSON.stringify(db));if(window.pywebview?.api?.save)window.pywebview.api.save(JSON.stringify(db)).catch(e=>console.error('Windows save',e))}catch(e){alert('No se pudo guardar: '+e.message)}}function nativeRestore(s){try{const x=JSON.parse(s);if(!valid(x))throw Error('Estado nativo inválido');if(x.seq>=db.seq){db=x;if(migrateLegacyMasks())save();localStorage.setItem(KEY,JSON.stringify(db));applyStyle();render()}window.mishuNativeReady=true;}catch(e){console.error(e);alert('No se pudo recuperar la biblioteca: '+e.message)}}window.mishuNativeRestore=nativeRestore;
let current=null,folder=null,collection=null,history=[],future=[],study=false,selectionText='',selectionNode=null,selectionStart=0,selectionEnd=0;const findNote=id=>db.notes.find(n=>n.id===id);const allNodes=ns=>ns.flatMap(n=>[n,...allNodes(n.children||[])]);function findNode(nodes,id){for(const n of nodes){if(n.id===id)return n;const a=findNode(n.children||[],id);if(a)return a}return null}let undoStack=[],redoStack=[];
function mutate(f){if(current)flushEdits();undoStack.push(JSON.stringify(db));if(undoStack.length>35)undoStack.shift();redoStack=[];f();save();render()}
function undoEdit(){if(study)return;if(!undoStack.length)return;flushEdits();redoStack.push(JSON.stringify(db));db=JSON.parse(undoStack.pop());save();render()}
function redoEdit(){if(study)return;if(!redoStack.length)return;flushEdits();undoStack.push(JSON.stringify(db));db=JSON.parse(redoStack.pop());save();render()}
function goto(id,record=true){if(current)flushEdits();if(id&&!findNote(id))return alert('Esta nota ya no existe');if(record){history.push(current);future=[]}current=id;hidePop();render();window.scrollTo(0,0)}function back(){if(current)flushEdits();if(!history.length)return;future.push(current);current=history.pop();render()}function forward(){if(current)flushEdits();if(!future.length)return;history.push(current);current=future.pop();render()}function modal(html){$('modal').innerHTML=html;$('modal').showModal()}function closeModal(){$('modal').close()}function ask(title,value,cb){modal(`<h3>${esc(title)}</h3><form method="dialog" id="askForm"><input id="askValue" type="text" value="${esc(value)}" required style="width:100%"><div class="toolbar"><button type="button" onclick="closeModal()">Cancelar</button><button class="primary">Guardar</button></div></form>`);$('askForm').onsubmit=e=>{e.preventDefault();const v=$('askValue').value.trim();if(v){closeModal();cb(v)}}}function hidePop(){$('popover').classList.add('hidden')}function positionPopover(anchor){const p=$('popover');if(!anchor)return;const r=anchor.getBoundingClientRect();p.style.transform='none';p.style.width='min(290px, calc(100vw - 16px))';p.style.maxHeight='min(70vh, 480px)';p.style.overflowY='auto';const w=p.getBoundingClientRect().width;let x=r.left;if(x+w>innerWidth-8)x=Math.max(8,innerWidth-w-8);if(x<8)x=8;let y=r.bottom+5;const h=p.getBoundingClientRect().height;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-5);if(y<8)y=8;p.style.left=x+'px';p.style.top=y+'px'}function pop(html,anchor){$('popover').removeAttribute('style');$('popover').innerHTML=html;$('popover').classList.remove('hidden');positionPopover(anchor||document.activeElement)};document.addEventListener('pointerdown',e=>{if(!e.target.closest('#popover,#optBtn,#navBtn'))hidePop();if(!e.target.closest('#selectionBar,.node-content,.study-text'))hideSelectionBar()});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
function folderNotes(folderId){return db.notes.filter(n=>n.folderId===folderId)}
function noteSequence(id,direction){if(current)flushEdits();const n=findNote(id);if(!n)return;const ordered=folderNotes(n.folderId),idx=ordered.findIndex(x=>x.id===id),target=ordered[idx+direction];if(target){goto(target.id);return}if(direction<0)return;const freshNote={id:uid(),folderId:n.folderId,title:'Nueva nota',nodes:[],created:now(),updated:now()};mutate(()=>{const pos=db.notes.findIndex(x=>x.id===n.id);db.notes.splice(pos+1,0,freshNote)});goto(freshNote.id)}
function moveLibraryItem(kind,id,direction){const list=kind==='collection'?db.collections:kind==='folder'?db.folders:db.notes;const obj=list.find(x=>x.id===id);if(!obj)return;const group=kind==='collection'?list:kind==='folder'?list.filter(x=>x.collectionId===obj.collectionId):list.filter(x=>x.folderId===obj.folderId);const idx=group.findIndex(x=>x.id===id),other=group[idx+direction];if(!other)return;mutate(()=>{const a=list.indexOf(obj),b=list.indexOf(other);[list[a],list[b]]=[list[b],list[a]]})}
function orderControls(kind,id){const list=kind==='collection'?db.collections:kind==='folder'?db.folders:db.notes;const obj=list.find(x=>x.id===id);if(!obj)return '';const group=kind==='collection'?list:kind==='folder'?list.filter(x=>x.collectionId===obj.collectionId):list.filter(x=>x.folderId===obj.folderId);const index=group.findIndex(x=>x.id===id);return `<span class="library-order"><button title="Subir" aria-label="Subir" ${index===0?'disabled':''} onclick="moveLibraryItem('${kind}','${id}',-1)">↑</button><button title="Bajar" aria-label="Bajar" ${index===group.length-1?'disabled':''} onclick="moveLibraryItem('${kind}','${id}',1)">↓</button></span>`}
function renameCurrentNote(){if(study)return;const n=findNote(current);if(n)ask('Título de nota',n.title,v=>mutate(()=>n.title=v))}const expandedCollections=new Set(),expandedFolders=new Set();function toggleLibraryGroup(kind,id){const group=kind==='collection'?expandedCollections:expandedFolders;if(group.has(id))group.delete(id);else group.add(id);render()}function libraryToggle(kind,id,name,open){return `<button class="library-toggle" aria-expanded="${open}" onclick="toggleLibraryGroup('${kind}','${id}')"><span aria-hidden="true">${open?'▾':'▸'}</span> ${esc(name)}</button>`}function render(){let out='';if(current){let n=findNote(current);if(!n){current=null;return render()}out=`<div class="breadcrumbs"><button onclick="goto(null)">Biblioteca</button> / ${esc(n.title)}</div><h1 class="note-document-title">${esc(n.title)}</h1><div class="note-sequence"><button onclick="noteSequence('${n.id}',-1)" ${folderNotes(n.folderId)[0]?.id===n.id?'disabled':''}>← Anterior</button><span class="sequence-info">${folderNotes(n.folderId).findIndex(x=>x.id===n.id)+1} / ${folderNotes(n.folderId).length}</span><button onclick="noteSequence('${n.id}',1)">${folderNotes(n.folderId).at(-1)?.id===n.id?'＋ Nueva nota':'Siguiente →'}</button></div><div class="toolbar">${study?'':`<button onclick="renameCurrentNote()">✎ Título</button><button onclick="addRoot()">＋ Tema</button><button onclick="undoEdit()" title="Deshacer">↶</button><button onclick="redoEdit()" title="Rehacer">↷</button>`}<button onclick="flushEdits();study=!study;hideSelectionBar();render()">${study?'Salir del estudio':'Modo estudio'}</button><button onclick="exportPDF()">PDF</button><button onclick="noteTagsUI()"># Etiquetas</button>${study?'':`<button onclick="noteActions('${n.id}',this)">⋯</button>`}</div><div id="nodes">${renderNodes(n.nodes||[],n.id)}</div>${!(n.nodes||[]).length?'<div class="empty">Añade tu primer tema.</div>':''}`}else{out=`<div class="toolbar"><button class="primary" onclick="createNote()">＋ Nota</button><button onclick="newFolder()">＋ Carpeta</button><button onclick="newCollection()">＋ Colección</button><button onclick="importItemUI()">Importar elemento</button><button onclick="compositePDFUI()">PDF compuesto</button><button onclick="createDemoCollection()">＋ Colección de prueba</button><button onclick="openTrash()">Papelera (${db.trash.length})</button></div>`;for(const c of db.collections){out+=`<section class="panel"><div class="toolbar">${libraryToggle('collection',c.id,c.name,expandedCollections.has(c.id))}${orderControls('collection',c.id)}<button onclick="renameCollection('${c.id}')">✎</button><button onclick="exportItem('collection','${c.id}')">Exportar</button>${c.id!==db.collections[0].id?`<button onclick="deleteCollection('${c.id}')">🗑</button>`:''}</div>`;if(expandedCollections.has(c.id))for(const f of db.folders.filter(x=>x.collectionId===c.id)){out+=`<div class="panel"><div class="toolbar">${libraryToggle('folder',f.id,f.name,expandedFolders.has(f.id))}${orderControls('folder',f.id)}<button onclick="renameFolder('${f.id}')">✎</button><button onclick="exportItem('folder','${f.id}')">Exportar</button>${f.id!==db.folders[0].id?`<button onclick="deleteFolder('${f.id}')">🗑</button>`:''}</div>`;if(expandedFolders.has(f.id))for(const n of db.notes.filter(x=>x.folderId===f.id)){out+=`<div class="note"><button onclick="noteActions('${n.id}',this)">⋯</button><button class="name" onclick="goto('${n.id}')">📄 ${esc(n.title)}</button>${orderControls('note',n.id)}<span class="muted">${new Date(n.updated||now()).toLocaleDateString()}</span></div>`}out+='</div>'}out+='</section>'}if(!db.notes.length)out+='<div class="empty">Tu biblioteca está lista. Crea tu primera nota.</div>'}$('main').innerHTML=out;}
function autoSizeEntry(el){if(!el)return;el.style.height="auto";el.style.height=Math.max(24,el.scrollHeight)+"px";const mirror=el.parentElement?.querySelector(".edit-text-mirror");if(mirror)mirror.style.minHeight=el.style.height}
function syncEditMirror(el){const id=el.closest('[data-node]')?.dataset.node,n=id&&locate(id),mirror=el.parentElement?.querySelector('.edit-text-mirror');if(!n||!mirror)return;mirror.innerHTML=renderMarkedText({...n,content:el.value},false);mirror.style.minHeight=el.offsetHeight+'px'}

function mediaURL(raw,type){try{const u=new URL(raw);if(u.protocol!=='https:')return '';if(u.hostname==='drive.google.com'||u.hostname==='www.drive.google.com'){let match=u.pathname.match(/\/file\/d\/([\w-]+)/);let id=match?.[1]||u.searchParams.get('id');if(id)return type==='image'?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1200':'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview'}return u.href}catch{return ''}}

function locate(id){const note=findNote(current);return note&&findNode(note.nodes,id)}function editNode(id,key,value){if(study)return;const n=locate(id);if(n)mutate(()=>{n[key]=value;findNote(current).updated=now()})}let editTimers={};function debouncedEdit(id,value){if(study)return;const edited=locate(id);if(edited&&edited.content!==value){adjustMarks(edited,value);edited.content=value}clearTimeout(editTimers[id]);editTimers[id]=setTimeout(()=>{const n=locate(id);if(n){n.content=value;findNote(current).updated=now();save()}},350)}function flushEdits(){for(const el of document.querySelectorAll('.node[data-node]')){let n=locate(el.dataset.node),ta=el.querySelector('textarea');if(n&&ta&& !study){if(n.content!==ta.value)adjustMarks(n,ta.value);n.content=ta.value}}Object.values(editTimers).forEach(clearTimeout);editTimers={};save()}function node(){return {id:uid(),title:'Nuevo tema',content:'',children:[],open:true,media:[]}}function addRoot(){if(study)return;mutate(()=>findNote(current).nodes.push(node()))}function addChild(id){if(study)return;mutate(()=>locate(id).children.push(node()))}function toggleNode(id){mutate(()=>locate(id).open=locate(id).open===false?true:false)}function siblings(id,nodes){for(let i=0;i<nodes.length;i++){if(nodes[i].id===id)return {nodes,i};const a=siblings(id,nodes[i].children||[]);if(a)return a}return null}function nodeActions(id,anchor){pop(`<button onclick="moveNode('${id}',-1)">↑ Subir</button><button onclick="moveNode('${id}',1)">↓ Bajar</button><button onclick="indentNode('${id}')">→ Jerarquizar más</button><button onclick="outdentNode('${id}')">← Jerarquizar menos</button><button onclick="duplicateNode('${id}')">Duplicar</button><button onclick="attachMedia('${id}')">Vincular multimedia</button><button onclick="manageNodeMedia('${id}')">Gestionar / eliminar multimedia</button><button onclick="removeNode('${id}')">Eliminar</button>`,anchor)}function moveNode(id,d){if(study)return;mutate(()=>{let s=siblings(id,findNote(current).nodes); document.addEventListener('selectionchange',()=>{const el=document.activeElement;if(el?.matches?.('textarea.node-content')){clearTimeout(window._relTimer);window._relTimer=setTimeout(()=>{if(el.isConnected&&el.selectionStart!==el.selectionEnd)captureSelection(el)},150)}});document.addEventListener('touchend',e=>{const el=e.target.closest?.('textarea.node-content');if(el)setTimeout(()=>{if(el.isConnected&&el.selectionStart!==el.selectionEnd)captureSelection(el)},200)},{passive:true});function hideSelectionBar(){$('selectionBar').classList.add('hidden')}function openRelations(){const q=(selectionText||'').replace(/\{\{|\}\}/g,'').trim();hideSelectionBar();if(!q){modal(`<h3>Buscar relaciones</h3><input id="relQuery" placeholder="Palabra o frase"><button onclick="relationUI(document.getElementById('relQuery').value)">Buscar</button><button onclick="closeModal()">Cerrar</button>`);return}relationUI(q)}function relationUI(q){q=String(q||'').replace(/\{\{|\}\}/g,'').trim();if(!q)return;window._lastRelationQuery=q;const matches=search(q);modal(`<h3>Relaciones con «${esc(q)}»</h3><p class=muted>Primero coincidencias exactas en el título; después coincidencias parciales y menciones en el contenido.</p><div class=relation-list>${matches.map(({n,score})=>`<div class=result><button onclick="previewRelation('${n.id}')"><b>${esc(n.title)}</b> · ${score===0?'Título exacto':score===1?'Título relacionado':'Mención en contenido'}</button>${score===2?`<div class=relationship-context>${esc(contextSnippet(n,q))}</div>`:''}</div>`).join('')||'<p>No se encontraron relaciones.</p>'}</div><button onclick="closeModal()">Cerrar</button>`)}function contextSnippet(n,q){let t=allNodes(n.nodes||[]).map(x=>x.title+' — '+x.content).join(' · '),i=t.toLocaleLowerCase().indexOf(q.toLocaleLowerCase());return i<0?'':t.slice(Math.max(0,i-65),i+q.length+110)}function previewRelation(id){let n=findNote(id);if(!n)return;modal(`<h3>${esc(n.title)}</h3><p class=muted>Vista flotante · no sales de tu nota original</p><div class=preview-scroll>${(function draw(ns,d=0){return ns.map(x=>`<section class=panel style="margin-left:${Math.min(d,8)*12}px"><b>${esc(x.title)}</b><p style="white-space:pre-wrap">${esc(x.content)}</p>${draw(x.children||[],d+1)}</section>`).join('')})(n.nodes||[])||'<p>Nota vacía</p>'}</div><button onclick="relationUI(window._lastRelationQuery)">← Resultados</button><button onclick="closeModal()">Cerrar</button>`)}function replaceSelected(replacement){if(study)return;if(!selectionNode||!selectionText)return;let n=locate(selectionNode);if(!n)return;let original=n.content||'';if(original.slice(selectionStart,selectionEnd)!==selectionText)return alert('La selección cambió. Selecciónala nuevamente.');mutate(()=>{n.content=original.slice(0,selectionStart)+replacement+original.slice(selectionEnd)});hideSelectionBar()}function adjustMarks(n,next){const prev=n.content||'',marks=n.marks||[];let start=0;while(start<prev.length&&start<next.length&&prev[start]===next[start])start++;let end=0;while(end<prev.length-start&&end<next.length-start&&prev[prev.length-1-end]===next[next.length-1-end])end++;const oldEnd=prev.length-end,delta=next.length-prev.length;n.marks=marks.flatMap(m=>{if(m.end<=start)return [m];if(m.start>=oldEnd)return [{...m,start:m.start+delta,end:m.end+delta}];return []})}

function toggleSelectedMask(){
 if(study||!selectionNode||!selectionText)return;
 const n=locate(selectionNode);
 if(!n||n.content.slice(selectionStart,selectionEnd)!==selectionText)return alert('Selecciona nuevamente el texto.');
 const a=selectionStart,b=selectionEnd;
 const marks=Array.isArray(n.marks)?n.marks:[];
 const hidden=marks.filter(m=>m.type==='hidden');
 // Remove only the selected overlap, preserving hidden parts outside the selection.
 const covered=hidden.some(m=>m.start<=a&&m.end>=b);

  n.marks=marks.flatMap(m=>{
   if(m.type!=='hidden'||m.end<=a||m.start>=b)return [m];
   const rest=[];
   if(m.start<a)rest.push({...m,end:a});
   if(m.end>b)rest.push({...m,start:b});
   return rest;
  });
  if(!covered)n.marks.push({start:a,end:b,type:'hidden'});
  findNote(current).updated=now();

  previewRoot.innerHTML=parsed.body.innerHTML
    .replace(/parent\.closePDFPreview\(\)/g,'closePDFPreview()');
  const scoped=previewStyles.replace(/@page\s*\{[^}]*\}/g,'')
    .replace(/\bbody\.plain\b/g,'.mishu-pdf-root.plain')
    .replace(/\bbody\b/g,'.mishu-pdf-root')
    .replace(/#document/g,'.mishu-pdf-root #document')
    .replace(/\.pdf-actions/g,'.mishu-pdf-root .pdf-actions')
    .replace(/\.pdf-node/g,'.mishu-pdf-root .pdf-node')
    .replace(/\.pdf-note/g,'.mishu-pdf-root .pdf-note')
    .replace(/\.pdf-content/g,'.mishu-pdf-root .pdf-content');

  frame.append(styleEl,previewRoot);

  const plain=previewRoot.querySelector('#plainPDF');
  if(plain)plain.onchange=()=>previewRoot.classList.toggle('plain',plain.checked);

  if(actions){const buttons=actions.querySelectorAll('button');
    if(buttons[0])buttons[0].onclick=()=>closePDFPreview();

  }

function translateUI(){
 const lang=db?.language||'es';document.documentElement.lang=lang;
 if(lang!=='en')return;
 const roots=[$('main'),$('modal'),$('popover'),$('selectionBar'),document.querySelector('header'),document.querySelector('nav')].filter(Boolean);
 const protectedSelector='textarea,[contenteditable],.node-content,.node-row input,.node-title-input,.name,.breadcrumbs,[data-no-translate],.tag-chip,.note-title,.node-title';
 const translateText=(value)=>{let trimmed=value.trim();if(!trimmed)return value;let translated=uiTranslations[trimmed];if(!translated){
   const match=trimmed.match(/^(.*?)(\s*\(\d+\))$/);if(match&&uiTranslations[match[1]])translated=uiTranslations[match[1]]+match[2];
 }return translated?value.replace(trimmed,translated):value};
 for(const root of roots){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
  while((node=walker.nextNode())){const parent=node.parentElement;if(!parent||parent.closest(protectedSelector)||parent.closest('script,style,option[value="user"]'))continue;node.nodeValue=translateText(node.nodeValue)}
  for(const el of root.querySelectorAll('input,textarea,button,select,option,[title],[aria-label]')){
   if(el.closest(protectedSelector))continue;
   for(const attr of ['placeholder','title','aria-label']){if(el.hasAttribute(attr)){const original=el.getAttribute(attr);const translated=translateText(original);if(original!==translated)el.setAttribute(attr,translated)}}
   if(el.tagName==='INPUT'&&['button','submit','reset'].includes(el.type))el.value=translateText(el.value);
  }
 }
}
