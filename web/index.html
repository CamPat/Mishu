'use strict';const KEY='mishu_v1',BK='mishu_backups_v1';const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>Date.now();function fresh(){const c=uid(),f=uid();return {schema:1,seq:0,updated:now(),collections:[{id:c,name:'Mi biblioteca'}],folders:[{id:f,collectionId:c,name:'General'}],notes:[],trash:[],style:{},templates:[]}}function valid(x){if(!(x&&x.schema===1&&Number.isSafeInteger(x.seq)&&x.seq>=0&&['collections','folders','notes','trash','templates'].every(k=>Array.isArray(x[k]))))return false;const ids=new Set();for(const n of [...x.notes,...x.trash]){if(!n||typeof n.id!=='string'||ids.has(n.id)||typeof n.title!=='string'||!Array.isArray(n.nodes))return false;ids.add(n.id);const check=(nodes,depth=0)=>depth<80&&nodes.every(v=>v&&typeof v.id==='string'&&typeof v.title==='string'&&typeof v.content==='string'&&Array.isArray(v.children)&&check(v.children,depth+1));if(!check(n.nodes))return false;}return true}let db;function load(){let arr=[];for(const k of [KEY,BK])try{let x=JSON.parse(localStorage.getItem(k)||'null');if(k===BK&&Array.isArray(x))arr.push(...x);else if(x)arr.push(x)}catch{}arr=arr.filter(valid).sort((a,b)=>b.seq-a.seq||b.updated-a.updated);db=arr[0]||fresh();if(!db.collections.length){let n=fresh();db.collections=n.collections;db.folders=n.folders}if(!db.folders.length)db.folders=[{id:uid(),collectionId:db.collections[0].id,name:'General'}];db.style??={};if(migrateLegacyMasks())save();applyStyle();if(!arr.length&&!window.MishuNative)save()}function save(){db.seq++;db.updated=now();try{let old=localStorage.getItem(KEY);let backups=JSON.parse(localStorage.getItem(BK)||'[]');if(old){let prev=JSON.parse(old);if(valid(prev)&&!backups.some(x=>x.seq===prev.seq))backups.push(prev)}backups=backups.slice(-4);localStorage.setItem(BK,JSON.stringify(backups));localStorage.setItem(KEY,JSON.stringify(db));if(window.MishuNative)window.MishuNative.save(JSON.stringify(db));if(window.pywebview?.api?.save)window.pywebview.api.save(JSON.stringify(db)).catch(e=>console.error('Windows save',e))}catch(e){alert('No se pudo guardar: '+e.message)}}function nativeRestore(s){try{const x=JSON.parse(s);if(!valid(x))throw Error('Estado nativo inválido');if(x.seq>=db.seq){db=x;if(migrateLegacyMasks())save();localStorage.setItem(KEY,JSON.stringify(db));applyStyle();render()}window.mishuNativeReady=true;}catch(e){console.error(e);alert('No se pudo recuperar la biblioteca: '+e.message)}}window.mishuNativeRestore=nativeRestore;
let current=null,folder=null,collection=null,history=[],future=[],study=false,selectionText='',selectionNode=null,selectionStart=0,selectionEnd=0,selectionField='content';const findNote=id=>db.notes.find(n=>n.id===id);const allNodes=ns=>ns.flatMap(n=>[n,...allNodes(n.children||[])]);function findNode(nodes,id){for(const n of nodes){if(n.id===id)return n;const a=findNode(n.children||[],id);if(a)return a}return null}let undoStack=[],redoStack=[];

function renameCurrentNote(){if(study)return;const n=findNote(current);if(n)ask('Título de nota',n.title,v=>mutate(()=>n.title=v))}const expandedCollections=new Set(),expandedFolders=new Set();function toggleLibraryGroup(kind,id){const group=kind==='collection'?expandedCollections:expandedFolders;if(group.has(id))group.delete(id);else group.add(id);render()}function libraryToggle(kind,id,name,open){return `<button class="library-toggle" aria-expanded="${open}" onclick="toggleLibraryGroup('${kind}','${id}')"><span aria-hidden="true">${open?'▾':'▸'}</span> ${esc(name)}</button>`}function render(){let out='';if(current){let n=findNote(current);if(!n){current=null;return render()}out=`<div class="breadcrumbs"><button onclick="goto(null)">Biblioteca</button> / ${esc(n.title)}</div><h1 class="note-document-title">${esc(n.title)}</h1><div class="note-sequence"><button onclick="noteSequence('${n.id}',-1)" ${folderNotes(n.folderId)[0]?.id===n.id?'disabled':''}>← Anterior</button><span class="sequence-info">${folderNotes(n.folderId).findIndex(x=>x.id===n.id)+1} / ${folderNotes(n.folderId).length}</span><button onclick="noteSequence('${n.id}',1)">${folderNotes(n.folderId).at(-1)?.id===n.id?'＋ Nueva nota':'Siguiente →'}</button></div><div class="toolbar">${study?'':`<button onclick="renameCurrentNote()">✎ Título</button><button onclick="addRoot()">＋ Tema</button><button onclick="undoEdit()" title="Deshacer">↶</button><button onclick="redoEdit()" title="Rehacer">↷</button>`}<button onclick="flushEdits();study=!study;hideSelectionBar();render()">${study?'Salir del estudio':'Modo estudio'}</button><button onclick="exportPDF()">PDF</button><button onclick="noteTagsUI()"># Etiquetas</button>${study?'':`<button onclick="noteActions('${n.id}',this)">⋯</button>`}</div><div id="nodes">${renderNodes(n.nodes||[],n.id)}</div>${!(n.nodes||[]).length?'<div class="empty">Añade tu primer tema.</div>':''}`}else{out=`<div class="toolbar"><button class="primary" onclick="createNote()">＋ Nota</but function mediaURL(raw,type){try{const u=new URL(raw);if(u.protocol!=='https:')return '';if(u.hostname==='drive.google.com'||u.hostname==='www.drive.google.com'){let match=u.pathname.match(/\/file\/d\/([\w-]+)/);let id=match?.[1]||u.searchParams.get('id');if(id)return type==='image'?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1200':'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview'}return u.href}catch{return ''}}

// Translate only interface chrome. Never translate user-authored titles, note bodies or tag names.
function translateUI(){
 const lang=db?.language||'es';document.documentElement.lang=lang;
 if(lang!=='en')return;
 const roots=[$('main'),$('modal'),$('popover'),$('selectionBar'),document.querySelector('header'),document.querySelector('nav')].filter(Boolean);
 const protectedSelector='textarea,[contenteditable],.node-content,.node-row input,.node-title-input,.name,.breadcrumbs,[data-no-translate],.tag-chip,.note-title,.node-title';
 const translateText=(value)=>{let trimmed=value.trim();if(!trimmed)return value;let translated=uiTranslations[trimmed];if(!translated){
   const match=trimmed.match(/^(.*?)(\s*\(\d+\))$/);if(match&&uiTranslations[match[1]])translated=uiTranslations[match[1]]+match[2];
 }return translated?value.replace(trimmed,translated):value};
 for(const root of roots){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
  while((node=walker.nextNode())){const parent=node.parentElement;if(!parent||parent.closest(protectedSelector)||parent.closest('script,style,option[value="user"]'))continue;node.nodeValue=translateText(node.nodeValue)}
  for(const el of root.querySelectorAll('input,textarea,button,select,option,[title],[aria-label]')){
   if(el.closest(protectedSelector))continue;
   for(const attr of ['placeholder','title','aria-label']){if(el.hasAttribute(attr)){const original=el.getAttribute(attr);const translated=translateText(original);if(original!==translated)el.setAttribute(attr,translated)}}
   if(el.tagName==='INPUT'&&['button','submit','reset'].includes(el.type))el.value=translateText(el.value);
  }
 }
}

function parsePastedHierarchy(source){
 const lines=String(source).replace(/\r\n?/g,'\n').split('\n');const roots=[],stack=[];
 for(let i=0;i<lines.length;i++){
  const raw=lines[i];if(!raw.trim())continue;
  const match=raw.match(/^\s*(>*)\s*(.*)$/);const depth=match[1].length,title=match[2].trim();
  if(!title)throw Error('Línea '+(i+1)+': falta el texto');
  if(depth>stack.length)throw Error('Línea '+(i+1)+': jerarquía sin padre');
  if(depth>40)throw Error('Demasiados niveles');
  const item={id:uid(),title,content:'',children:[],open:true,media:[]};
  if(depth===0)roots.push(item);else stack[depth-1].children.push(item);
  stack.length=depth;stack.push(item);
 }
 return roots;
}
function applyPastedHierarchy(id){
 if(study)return;const value=$('pasteHierarchyText')?.value||'';let items;
 try{items=parsePastedHierarchy(value)}catch(e){alert(e.message);return}
 if(!items.length)return alert('Escribe al menos un tema');
 const selected=locate(id);if(!selected)return alert('Tema no encontrado');
 // Insert roots as siblings immediately after the selected topic, not as its children.
 // Entire pasted trees move together and existing topics remain untouched.
 closeModal();mutate(()=>{const position=siblings(id,findNote(current).nodes);if(position)position.nodes.splice(position.i+1,0,...items);findNote(current).updated=now()});
}

// Manual cloud sync. Credentials are kept only in session memory (never in backups).
const CLOUD_CONFIG_KEY='mishu_cloud_config_v1';
let cloudSecret='';
let googleAccessToken='', googleTokenClient=null;
const GOOGLE_SCOPE='https://www.googleapis.com/auth/drive.file';
function cloudGoogleClientId(){return (localStorage.getItem('mishu_google_client_id')||'').trim()}
function cloudGoogleClientIdSave(){const input=$('cloudGoogleClientId');if(!input)return;const id=input.value.trim();if(id&&!/^[0-9]+-[a-z0-9-]+\.apps\.googleusercontent\.com$/i.test(id))throw Error(cloudText('ID de cliente OAuth inválido','Invalid OAuth client ID'));if(id)localStorage.setItem('mishu_google_client_id',id);else localStorage.removeItem('mishu_google_client_id')}
function loadGoogleIdentity(){return new Promise((resolve,reject)=>{if(window.google?.accounts?.oauth2)return resolve();const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.async=true;script.onload=resolve;script.onerror=()=>reject(Error(cloudText('No se pudo cargar el inicio de sesión de Google','Could not load Google sign-in')));document.head.appendChild(script)})}
async function googleSignIn(){
 const status=$('cloudStatus');try{
  cloudGoogleClientIdSave();
  if(window.pywebview?.api?.google_login){const token=await window.pywebview.api.google_login(cloudGoogleClientId());if(!token)throw Error(cloudText('Inicio de sesión cancelado','Sign-in cancelled'));googleAccessToken=token;cloudSecret=token;}
  else if(window.MishuNative?.googleLogin){window.MishuNative.googleLogin();if(status)status.textContent=cloudText('Completa el acceso en el navegador y vuelve a Mishu.','Complete sign-in in the browser and return to Mishu.');return;}
  else{
   const client_id=cloudGoogleClientId();if(!client_id)throw Error(cloudText('Configura primero el ID de cliente OAuth web','Configure the web OAuth client ID first'));
   await loadGoogleIdentity();
   await new Promise((resolve,reject)=>{googleTokenClient=google.accounts.oauth2.initTokenClient({client_id,scope:GOOGLE_SCOPE,callback:result=>{if(result.error)return reject(Error(result.error));googleAccessToken=result.access_token;cloudSecret=googleAccessToken;resolve()}});googleTokenClient.requestAccessToken({prompt:'consent'})});
  }
  if(status)status.textContent=cloudText('Google Drive conectado. Selecciona Actualizar / Sincronizar.','Google Drive connected. Choose Update / Sync.');
 }catch(e){if(status)status.textContent=cloudText('Error: ','Error: ')+e.message}
}

function cloudText(es,en){return db?.language==='en'?en:es}
function cloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||'{}')}catch{return {}}}
function cloudUI(){
 const cfg=cloudConfig(), provider=cfg.provider||'github';
 modal(`<h3>${cloudText('Sincronización manual','Manual synchronization')}</h3>
 <p>${cloudText('Elige una nube y una carpeta de guardado. Se comparará la fecha de la biblioteca local con la de la nube. No se mezclan cambios.','Choose a cloud and save folder. The local library timestamp is compared with the cloud copy. Changes are not merged.')}</p>
 <label>${cloudText('Proveedor','Provider')}</label><select id="cloudProvider" onchange="cloudProviderFields()"><option value="github" ${provider==='github'?'selected':''}>GitHub</option><option value="dropbox" ${provider==='dropbox'?'selected':''}>Dropbox</option><option value="gdrive" ${provider==='gdrive'?'selected':''}>Google Drive</option></select>
 <div id="cloudProviderFields"></div>
 <label>${cloudText('Carpeta / partida','Folder / save slot')}</label><input id="cloudSlot" style="width:100%" value="${esc(cfg.slot||'principal')}" placeholder="principal">
 <p class="muted">${cloudText('Cada carpeta es una partida independiente. Usa exactamente la misma cuenta, repositorio (si corresponde) y carpeta en los demás dispositivos.','Each folder is an independent save slot. Use the same account, repository (if applicable), and folder on your other devices.')}</p>
 <div id="cloudTokenWrap"><label>${cloudText('Token de acceso (no se guarda)','Access token (not stored)')}</label><input id="cloudToken" type="password" autocomplete="off" style="width:100%" placeholder="${cloudText('Pegar token','Paste token')}">
 <p class="muted">${cloudText('El token solo permanece en memoria durante esta sesión. Utiliza permisos mínimos. No compartas el token ni lo incluyas en una exportación.','The token stays in memory only for this session. Use minimum permissions. Never share the token or include it in exports.')}</p>
 </div><div class="toolbar"><button onclick="closeModal()">${cloudText('Cancelar','Cancel')}</button><button class="primary" id="cloudGo" onclick="cloudSync()">${cloudText('Actualizar / Sincronizar','Update / Sync')}</button></div><p id="cloudStatus" role="status"></p>`);

function cloudProviderFields(){
 const p=$('cloudProvider').value,cfg=cloudConfig();
 $('cloudProviderFields').innerHTML=p==='gdrive'?`<label>${cloudText('ID de cliente OAuth de Google (web/Windows)','Google OAuth client ID (web/Windows)')}</label><input id="cloudGoogleClientId" style="width:100%" value="${esc(cloudGoogleClientId())}" placeholder="123456-xxx.apps.googleusercontent.com"><p class="muted">${cloudText('Crea un cliente OAuth en Google Cloud. En web usa tipo Aplicación web y registra el origen de tu sitio. En Windows usa un cliente de escritorio. No introduzcas contraseñas.','Create an OAuth client in Google Cloud. For web use Web application and register your site origin. For Windows use a Desktop client. Never enter passwords.')}</p><button onclick="googleSignIn()">${cloudText('Iniciar sesión con Google','Sign in with Google')}</button>`:p==='github'?`<label>${cloudText('Repositorio privado (propietario/repositorio)','Private repository (owner/repository)')}</label><input id="cloudRepo" style="width:100%" value="${esc(cfg.repo||'')}" placeholder="usuario/mishu-backups"><p class="muted">${cloudText('El repositorio debe existir. Token GitHub con permiso Contents: Read and write.','Repository must already exist. GitHub token requires Contents: Read and write.')}</p>`:`<p class="muted">${cloudText('Usa un token OAuth de Dropbox con acceso a archivos.','Use a Dropbox OAuth access token with file access.')}</p>`;
 $('cloudTokenWrap').style.display=p==='gdrive'?'none':'';
}
function cloudPath(slot){let parts=slot.split('/').map(x=>x.trim()).filter(Boolean);if(!parts.length||parts.some(x=>!/^[-\w .áéíóúÁÉÍÓÚñÑ]{1,70}$/.test(x)||x==='.'||x==='..'))throw Error(cloudText('Nombre de carpeta no válido','Invalid folder name'));return parts.join('/')+'/mishu-backup.json'}
function b64encode(str){const bytes=new TextEncoder().encode(str);let out='';for(let i=0;i<bytes.length;i+=8192)out+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(out)}
function b64decode(str){const raw=atob(str.replace(/\s/g,'')),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
async function cloudRequest(url,opts){let res;try{res=await fetch(url,opts)}catch(e){throw Error(cloudText('Error de conexión o CORS: ','Connection or CORS error: ')+e.message)}return res}
async function cloudRead(provider,repo,path,token){
 if(provider==='gdrive')return driveRead(path,token);
 if(provider==='github'){
  const url='https://api.github.com/repos/'+repo.split('/').map(encodeURIComponent).join('/')+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
  const headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  const r=await cloudRequest(url,{headers,cache:'no-store'});if(r.status===404)return {data:null,sha:null};if(!r.ok)throw Error('GitHub HTTP '+r.status+' '+(await r.text()).slice(0,180));
  const x=await r.json();if(!x.content||!x.sha)throw Error('Invalid GitHub file');return {data:JSON.parse(b64decode(x.content)),sha:x.sha,url,headers};
 }
 const headers={'Authorization':'Bearer '+token,'Dropbox-API-Arg':JSON.stringify({path:'/'+path})};
 const r=await cloudRequest('https://content.dropboxapi.com/2/files/download',{method:'POST',headers});
 if(r.status===409){const detail=await r.text();if(detail.includes('not_found'))return {data:null};throw Error('Dropbox HTTP 409 '+detail.slice(0,180))}
 if(!r.ok)throw Error('Dropbox HTTP '+r.status+' '+(await r.text()).slice(0,180));return {data:JSON.parse(await r.text())};
}
async function cloudWrite(provider,repo,path,token,data,sha){
 const payload=JSON.stringify(data);
 if(provider==='gdrive')return driveWrite(path,token,data,sha);
 if(provider==='github'){
  const url='https://api.github.com/repos/'+repo.split('/').map(encodeURIComponent).join('/')+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
  const body={message:'Mishu manual backup '+new Date().toISOString(),content:b64encode(payload)};if(sha)body.sha=sha;
  const r=await cloudRequest(url,{method:'PUT',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify(body)});
  if(!r.ok)throw Error('GitHub HTTP '+r.status+' '+(await r.text()).slice(0,180));return;
 }
 const r=await cloudRequest('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/octet-stream','Dropbox-API-Arg':JSON.stringify({path:'/'+path,mode:'overwrite',autorename:false,mute:true})},body:payload});
 if(!r.ok)throw Error('Dropbox HTTP '+r.status+' '+(await r.text()).slice(0,180));
}
// Google Drive REST API. A user-supplied short-lived OAuth access token is kept only in memory.
// drive.file scope only sees files/folders created or explicitly opened by this application.
const DRIVE_API='https://www.googleapis.com/drive/v3/files';
async function driveApi(url,token,options={}){
 const headers={'Authorization':'Bearer '+token,...(options.headers||{})};
 const r=await cloudRequest(url,{...options,headers});
 if(!r.ok)throw Error('Google Drive HTTP '+r.status+' '+(await r.text()).slice(0,250));
 return r;
}
function driveQuote(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function driveFind(parent,name,mime,token){
 const q="name = '"+driveQuote(name)+"' and '"+driveQuote(parent)+"' in parents and trashed = false"+(mime?" and mimeType = '"+driveQuote(mime)+"'":"");
 const u=DRIVE_API+'?q='+encodeURIComponent(q)+'&fields='+encodeURIComponent('nextPageToken,files(id,name,mimeType,modifiedTime)')+'&pageSize=100';
 const r=await driveApi(u,token);const obj=await r.json();return (obj.files||[]).sort((a,b)=>String(b.modifiedTime).localeCompare(String(a.modifiedTime)))[0]||null;
}
async function driveFolder(parent,name,token,create){
 let f=await driveFind(parent,name,'application/vnd.google-apps.folder',token);
 if(!f&&create){const r=await driveApi(DRIVE_API+'?fields=id,name',token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parent]})});f=await r.json()}
 return f?.id||null;
}
async function driveLocation(path,token,create){
 const parts=['Mishu',...path.split('/')];const fileName=parts.pop();let parent='root';
 for(const part of parts){parent=await driveFolder(parent,part,token,create);if(!parent)return {parent:null,file:null}}
 return {parent,file:await driveFind(parent,fileName,null,token),fileName};
}
async function driveRead(path,token){
 const loc=await driveLocation(path,token,false);
 if(!loc.file)return {data:null,sha:null};
 const r=await driveApi(DRIVE_API+'/'+encodeURIComponent(loc.file.id)+'?alt=media',token);
 return {data:JSON.parse(await r.text()),sha:loc.file.id,version:loc.file.modifiedTime};
}
async function driveWrite(path,token,data,previousId){
 const loc=await driveLocation(path,token,true);const payload=JSON.stringify(data);
 if(loc.file){
  if(previousId&&previousId!==loc.file.id)throw Error(cloudText('El archivo remoto cambió; vuelve a sincronizar.','Remote file changed; sync again.'));
  await driveApi('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(loc.file.id)+'?uploadType=media',token,{method:'PATCH',headers:{'Content-Type':'application/json'},body:payload});
 }else{
  const boundary='mishu'+Date.now();const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:loc.fileName,mimeType:'application/json',parents:[loc.parent]})+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+payload+'\r\n--'+boundary+'--';
  await driveApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',token,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
 }
}
function cloudKeepLocalBackup(){try{const old=localStorage.getItem(KEY);if(old){const prev=JSON.parse(old);if(valid(prev)){let arr=JSON.parse(localStorage.getItem(BK)||'[]');arr.push(prev);localStorage.setItem(BK,JSON.stringify(arr.slice(-4)))}}}catch(e){console.warn('Backup before cloud restore',e)}}
async function cloudSync(){
 const button=$('cloudGo'),status=$('cloudStatus');if(!button||button.disabled)return;
 button.disabled=true;status.textContent=cloudText('Conectando…','Connecting…');
 try{
  if(current)flushEdits();
  const provider=$('cloudProvider').value,repo=provider==='github'?$('cloudRepo').value.trim():'',slot=$('cloudSlot').value.trim();
  const token=provider==='gdrive'?googleAccessToken:($('cloudToken').value.trim()||cloudSecret);
  if(!token)throw Error(cloudText('Introduce un token de acceso','Enter an access token'));
  if(provider==='github'&&!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo))throw Error(cloudText('Usa propietario/repositorio','Use owner/repository'));
  const path=cloudPath(slot);
  localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify({provider,repo,slot}));cloudSecret=token;
  const remote=await cloudRead(provider,repo,path,token);
  if(remote.data&&!valid(remote.data))throw Error(cloudText('La copia remota no es una biblioteca válida','Remote backup is not a valid library'));
  const localTime=Number(db.updated)||0,remoteTime=remote.data?Number(remote.data.updated)||0:0;
  if(!remote.data||localTime>remoteTime){
   const message=remote.data?cloudText('La copia local es más reciente. ¿Sobrescribir la copia en la nube?','Local copy is newer. Overwrite the cloud copy?'):cloudText('No existe copia en esta carpeta. ¿Subir la biblioteca local?','No backup exists in this folder. Upload local library?');
   if(!confirm(message)){status.textContent=cloudText('Cancelado','Cancelled');return}
   // Check the remote again to reduce the risk of overwriting another device's update.
   const check=await cloudRead(provider,repo,path,token);
   if(JSON.stringify(check.data)!==JSON.stringify(remote.data))throw Error(cloudText('La nube cambió durante la operación. Repite la sincronización.','Cloud changed during synchronization. Try again.'));
   await cloudWrite(provider,repo,path,token,db,check.sha);
   status.textContent=cloudText('Biblioteca subida a la nube correctamente.','Library uploaded successfully.');
  }else if(remoteTime>localTime){
   if(!confirm(cloudText('La nube es más reciente. ¿Reemplazar la biblioteca local? Se conservará una copia local de recuperación.','Cloud copy is newer. Replace the local library? A local recovery backup will be kept.'))){status.textContent=cloudText('Cancelado','Cancelled');return}
   cloudKeepLocalBackup();db=remote.data;localStorage.setItem(KEY,JSON.stringify(db));
   if(window.MishuNative?.save)window.MishuNative.save(JSON.stringify(db));
   if(window.pywebview?.api?.save)await window.pywebview.api.save(JSON.stringify(db));
   current=null;history.length=0;future.length=0;applyStyle();render();
   status.textContent=cloudText('Biblioteca restaurada desde la nube.','Library restored from cloud.');
  }else{
   if(JSON.stringify(remote.data)===JSON.stringify(db))status.textContent=cloudText('Ya está sincronizado.','Already synchronized.');
   else status.textContent=cloudText('Ambas copias tienen la misma fecha, pero difieren. No se sobrescribió ninguna. Revisa los dispositivos y exporta una copia antes de continuar.','Both copies have the same timestamp but differ. Neither was overwritten. Review devices and export a backup first.');
  }
 }catch(e){status.textContent=cloudText('Error: ','Error: ')+e.message;console.error('Cloud sync',e)}finally{button.disabled=false}
}
