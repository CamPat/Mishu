function mediaURL(raw,type){try{const u=new URL(raw);if(u.protocol!=='https:')return '';if(u.hostname==='drive.google.com'||u.hostname==='www.drive.google.com'){let match=u.pathname.match(/\/file\/d\/([\w-]+)/);let id=match?.[1]||u.searchParams.get('id');if(id)return type==='image'?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1200':'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview'}return u.href}catch{return ''}}
function videoSource(raw){try{const u=new URL(raw);if(u.protocol!=='https:')return null;const host=u.hostname.toLowerCase().replace(/^www\./,'');let id='';if(host==='youtube.com'||host==='m.youtube.com'||host==='youtube-nocookie.com'){id=u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]+)/)?.[1]||'';if(/^[\w-]{11}$/.test(id))return {kind:'embed',url:'https://www.youtube-nocookie.com/embed/'+id+'?playsinline=1'}}if(host==='youtu.be'){id=u.pathname.split('/')[1]||'';if(/^[\w-]{11}$/.test(id))return {kind:'embed',url:'https://www.youtube-nocookie.com/embed/'+id+'?playsinline=1'}}if(host==='drive.google.com'){let match=u.pathname.match(/\/file\/d\/([\w-]+)/);id=match?.[1]||u.searchParams.get('id');if(id)return {kind:'embed',url:'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview'}}if(host==='vimeo.com'){id=u.pathname.match(/^\/(\d+)/)?.[1];if(id)return {kind:'embed',url:'https://player.vimeo.com/video/'+id}}if(/\.(mp4|webm|ogv)(?:$|[?#])/i.test(u.href))return {kind:'file',url:u.href};return {kind:'external',url:u.href}}catch{return null}}
function videoPlayer(raw,expanded=false){const source=videoSource(raw),safe=esc(source?.url||'');if(!source)return '<p>Enlace de video no válido.</p>';let media=source.kind==='file'?`<video controls playsinline preload="metadata" style="display:block;width:100%;max-height:${expanded?'70vh':'360px'};background:#111;border-radius:12px" src="${safe}"></video>`:source.kind==='embed'?`<iframe title="Reproductor de video" loading="lazy" src="${safe}" style="display:block;width:100%;height:${expanded?'65vh':'260px'};border:0;border-radius:12px;background:#111" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`:'<p>Este proveedor no admite una vista integrada conocida.</p>';return `<div class="mishu-video">${media}<p style="margin:8px 0"><a href="${esc(raw)}" target="_blank" rel="noopener noreferrer">Abrir video externamente si no se reproduce</a></p></div>`}

function locate(id){const note=findNote(current);return note&&findNode(note.nodes,id)}function editNode(id,key,value){if(study)return;const n=locate(id);if(n)mutate(()=>{n[key]=value;findNote(current).updated=now()})}let editTimers={};function debouncedEdit(id,value){if(study)return;const edited=locate(id);if(edited&&edited.content!==value){adjustMarks(edited,value);edited.content=value}clearTimeout(editTimers[id]);editTimers[id]=setTimeout(()=>{const n=locate(id);if(n){n.content=value;findNote(current).updated=now();save()}},350)}function flushEdits(){for(const el of document.querySelectorAll('.node[data-node]')){const titleEl=el.querySelector(':scope > .node-row > .node-title-input');const titleNode=locate(el.dataset.node);if(titleNode&&titleEl&&!study)titleNode.title=titleEl.value;let n=locate(el.dataset.node),ta=el.querySelector('.node-content');if(n&&ta&& !study){if(n.content!==ta.value)adjustMarks(n,ta.value);n.content=ta.value}}Object.values(editTimers).forEach(clearTimeout);editTimers={};save()}function node(){return {id:uid(),title:'Nuevo tema',content:'',children:[],open:true,media:[]}}function addRoot(){if(study)return;mutate(()=>findNote(current).nodes.push(node()))}function addChild(id){if(study)return;mutate(()=>locate(id).children.push(node()))}function toggleNode(id){mutate(()=>locate(id).open=locate(id).open===false?true:false)}function siblings(id,nodes){for(let i=0;i<nodes.length;i++){if(nodes[i].id===id)return {nodes,i};const a=siblings(id,nodes[i].children||[]);if(a)return a}return null}function nodeActions(id,anchor){pop(`<button onclick="moveNode('${id}',-1)">↑ Subir</button><button onclick="moveNode('${id}',1)">↓ Bajar</button><button onclick="outdentNode('${id}')">← Jerarquizar más</button><button onclick="indentNode('${id}')">→ Jerarquizar menos</button><button onclick="duplicateNode('${id}')">Duplicar</button><button onclick="attachMedia('${id}')">Vincular multimedia</button><button onclick="manageNodeMedia('${id}')">Gestionar / eliminar multimedia</button><button onclick="pasteTextUI('${id}')">Pegar texto / Paste text</button><button onclick="removeNode('${id}')">Eliminar</button>`,anchor)}function moveNode(id,d){if(study)return;mutate(()=>{let s=siblings(id,findNote(current).nodes);if(s){let j=s.i+d;if(j>=0&&j<s.nodes.length)[s.nodes[s.i],s.nodes[j]]=[s.nodes[j],s.nodes[s.i]]}})}function indentNode(id){if(study)return;mutate(()=>{let s=siblings(id,findNote(current).nodes);if(s&&s.i>0)s.nodes[s.i-1].children.push(...s.nodes.splice(s.i,1))})}function outdentNode(id){if(study)return;mutate(()=>{let root=findNote(current).nodes;function walk(ns,parent){for(let i=0;i<ns.length;i++){if(ns[i].id===id&&parent){let p=siblings(parent.id,root);if(p){p.nodes.splice(p.i+1,0,...ns.splice(i,1));return true}}if(walk(ns[i].children||[],ns[i]))return true}return false}walk(root,null)})}function duplicateNode(id){if(study)return;mutate(()=>{let s=siblings(id,findNote(current).nodes);if(s){let copy=JSON.parse(JSON.stringify(s.nodes[s.i]));function reset(n){n.id=uid();n.children.forEach(reset);(n.media||[]).forEach(m=>m.id=uid())}reset(copy);s.nodes.splice(s.i+1,0,copy)}})}function removeNode(id){if(study)return;if(confirm('¿Eliminar este tema y todos sus subtemas?'))mutate(()=>{let s=siblings(id,findNote(current).nodes);if(s)s.nodes.splice(s.i,1)})}

cturedClone(findNote(id));n.id=uid();n.title+=' (copia)';n.nodes.forEach(function fix(x){x.id=uid();x.children.forEach(fix)});db.notes.push(n)})}function moveNote(id){

function importMishuItem(a){try{if(a.format!=='mishu-item'||a.version!==1||!['collection','folder','note'].includes(a.type)||!Array.isArray(a.collections)||!Array.isArray(a.folders)||!Array.isArray(a.notes))throw Error('No es un archivo individual de Mishu');if(a.collections.length>500||a.folders.length>5000||a.notes.length>10000)throw Error('Demasiados elementos');const checkNode=(n,d=0)=>d<80&&n&&typeof n.title==='string'&&typeof n.content==='string'&&Array.isArray(n.children)&&n.children.every(c=>checkNode(c,d+1));if(!a.collections.every(c=>c&&typeof c.id==='string'&&typeof c.name==='string')||!a.folders.every(f=>f&&typeof f.id==='string'&&typeof f.collectionId==='string'&&typeof f.name==='string')||!a.notes.every(n=>n&&typeof n.id==='string'&&typeof n.folderId==='string'&&typeof n.title==='string'&&Array.isArray(n.nodes)&&n.nodes.every(x=>checkNode(x))))throw Error('Datos incompletos');if(!confirm(`¿Importar ${a.notes.length} nota(s), ${a.folders.length} carpeta(s) y sus colecciones?`))return;const cs=new Map(),fs=new Map();const newCs=a.collections.map(c=>{let id=uid();cs.set(c.id,id);return {id,name:c.name}});const newFs=a.folders.map(f=>{let id=uid();fs.set(f.id,id);return {id,collectionId:cs.get(f.collectionId)||db.collections[0].id,name:f.name}});function copyNode(n){return {...n,id:uid(),children:n.children.map(copyNode),media:Array.isArray(n.media)?n.media.map(m=>({...m,id:uid()})):[]}}const newNotes=a.notes.map(n=>({...n,id:uid(),folderId:fs.get(n.folderId)||db.folders[0].id,nodes:n.nodes.map(copyNode),created:now(),updated:now()}));mutate(()=>{db.collections.push(...newCs);db.folders.push(...newFs);db.notes.push(...newNotes)});closeModal();alert('Importación completada: '+newNotes.length+' nota(s).')}catch(e){alert('No se pudo importar: '+e.message)}}

let flowSession=null;
const flowL=(es,en)=>db.language==='en'?en:es;
const flowClamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function flowDiagram(nodeId,id){return (locate(nodeId)?.diagrams||[]).find(d=>d.id===id)}
function flowAdd(nodeId){
 if(study)return;flushEdits();const n=locate(nodeId);if(!n)return;
 const d={id:uid(),title:flowL('Diagrama de flujo','Flowchart'),orientation:'landscape',nodes:[{id:uid(),x:390,y:280,w:220,h:90,text:flowL('Inicio','Start'),shape:'round',fontSize:22,bold:true,italic:false,align:'center',color:'#ffffff',textColor:'#292332'}],edges:[]};

}
function flowRemove(nodeId,id){if(!confirm(flowL('¿Eliminar diagrama?','Delete diagram?')))return;mutate(()=>{const n=locate(nodeId);n.diagrams=(n.diagrams||[]).filter(d=>d.id!==id);findNote(current).updated=now()})}
function flowTextLines(text,w,font){
 const max=Math.max(4,Math.floor((w-20)/(font*.57)));const lines=[];
 for(const paragraph of String(text||'').split('\n')){let line='';for(const word of paragraph.split(/\s+/)){if(!word)continue;if((line+' '+word).trim().length>max&&line){lines.push(line);line=word}else line=(line+' '+word).trim()}lines.push(line||' ')}
 return lines.slice(0,18);
}
function flowSVG(d,interactive=false){

 const arrow=`<defs><marker id="mishu-flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#74548e"/></marker></defs>`;
 const links=edges.map(e=>{const a=byId.get(e.from),b=byId.get(e.to);if(!a||!b)return '';
 const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2,dx=bx-ax,dy=by-ay;
 let x1,y1,x2,y2;if(Math.abs(dx)/(a.w+b.w)>Math.abs(dy)/(a.h+b.h)){x1=ax+Math.sign(dx)*a.w/2;y1=ay;x2=bx-Math.sign(dx)*b.w/2;y2=by}else{x1=ax;y1=ay+Math.sign(dy)*a.h/2;x2=bx;y2=by-Math.sign(dy)*b.h/2}
 const midX=(x1+x2)/2,midY=(y1+y2)/2;
 const curve=e.style==='curve'?`M${x1},${y1} Q${midX+Math.min(70,Math.abs(y2-y1)/2)},${midY} ${x2},${y2}`:`M${x1},${y1} L${x2},${y2}`;
 return `<path d="${curve}" fill="none" stroke="#74548e" stroke-width="3" marker-end="url(#mishu-flow-arrow)"/>`}).join('');
 const shapes=nodes.map(n=>{const fs=flowClamp(Number(n.fontSize)||20,10,40),w=flowClamp(Number(n.w)||200,90,650),h=flowClamp(Number(n.h)||85,45,300),x=Number(n.x)||0,y=Number(n.y)||0;
 const color=/^#[0-9a-f]{6}$/i.test(n.color||'')?n.color:'#ffffff',tc=/^#[0-9a-f]{6}$/i.test(n.textColor||'')?n.textColor:'#292332';
 const tag=n.shape==='diamond'?`<polygon points="${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}" fill="${color}" stroke="#74548e" stroke-width="2"/>`:n.shape==='ellipse'?`<ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${w/2}" ry="${h/2}" fill="${color}" stroke="#74548e" stroke-width="2"/>`:`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${n.shape==='round'?Math.min(28,h/3):2}" fill="${color}" stroke="#74548e" stroke-width="2"/>`;
 const lines=flowTextLines(n.text,w*(n.shape==='diamond'?.65:.9),fs),step=fs*1.16,total=lines.length*step;
 const tx=n.align==='left'?x+w*.16:n.align==='right'?x+w*.84:x+w/2,anchor=n.align==='left'?'start':n.align==='right'?'end':'middle';
 const text=lines.map((line,i)=>`<text x="${tx}" y="${y+h/2-total/2+(i+.82)*step}" font-family="Arial,sans-serif" font-size="${fs}" font-weight="${n.bold?'700':'400'}" font-style="${n.italic?'italic':'normal'}" fill="${tc}" text-anchor="${anchor}">${esc(line)}</text>`).join('');
 return `<g ${interactive?`data-flow-node="${n.id}" style="cursor:grab;touch-action:none"`:''}>${tag}${text}</g>`}).join('');

// Translate only interface chrome. Never translate user-authored titles, note bodies or tag names.
function translateUI(){
 const lang=db?.language||'en';document.documentElement.lang=lang;
 if(lang!=='en')return;
 const roots=[$('main'),$('modal'),$('popover'),$('selectionBar'),document.querySelector('header'),document.querySelector('nav')].filter(Boolean);
 const protectedSelector='textarea,[contenteditable],.node-content,.node-row input,.node-title-input,.name,.breadcrumbs,[data-no-translate],.tag-chip,.note-title,.node-title';
 const translateText=(value)=>{let trimmed=value.trim();if(!trimmed)return value;let translated=uiTranslations[trimmed];if(!translated){
   const match=trimmed.match(/^(.*?)(\s*\(\d+\))$/);if(match&&uiTranslations[match[1]])translated=uiTranslations[match[1]]+match[2];
 }return translated?value.replace(trimmed,translated):value};
 for(const root of roots){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
  while((node=walker.nextNode())){const parent=node.parentElement;if(!parent||parent.closest(protectedSelector)||parent.closest('script,style,option[value="user"]'))continue;node.nodeValue=translateText(node.nodeValue)}
  for(const el of root.querySelectorAll('input,textarea,button,select,option,[title],[aria-label]')){
   if(el.closest(protectedSelector))continue;
   for(const attr of ['placeholder','title','aria-label']){if(el.hasAttribute(attr)){const original=el.getAttribute(attr);const translated=translateText(original);if(original!==translated)el.setAttribute(attr,translated)}}
   if(el.tagName==='INPUT'&&['button','submit','reset'].includes(el.type))el.value=translateText(el.value);
  }
 }
}

function pasteTextUI(id){
 if(study)return;hidePop();
 modal(`<h3>Pegar texto</h3><p>Una línea sin &gt; se pega al mismo nivel, justo después del tema seleccionado. Cada &gt; inicial crea un subtema del tema pegado anterior. Los subtemas existentes se conservan.</p><textarea id="pasteHierarchyText" spellcheck="false" style="width:100%;min-height:45vh;resize:vertical;font-family:monospace" placeholder="${db?.language==='en'?'Topic A&#10;> Subtopic A1&#10;>> Subtopic A1.1&#10;Topic B':'Tema A&#10;> Subtema A1&#10;>> Subtema A1.1&#10;Tema B'}"></textarea><div class="toolbar"><button onclick="closeModal()">Cancelar</button><button onclick="applyPastedHierarchy('${id}')">Aceptar</button></div>`);
}
function parsePastedHierarchy(source){
 const lines=String(source).replace(/\r\n?/g,'\n').split('\n');const roots=[],stack=[];
 for(let i=0;i<lines.length;i++){
  const raw=lines[i];if(!raw.trim())continue;
  const match=raw.match(/^\s*(>*)\s*(.*)$/);const depth=match[1].length,title=match[2].trim();
  if(!title)throw Error('Línea '+(i+1)+': falta el texto');
  if(depth>stack.length)throw Error('Línea '+(i+1)+': jerarquía sin padre');
  if(depth>40)throw Error('Demasiados niveles');
  const item={id:uid(),title,content:'',children:[],open:true,media:[]};
  if(depth===0)roots.push(item);else stack[depth-1].children.push(item);
  stack.length=depth;stack.push(item);
 }
 return roots;
}
function applyPastedHierarchy(id){
 if(study)return;const value=$('pasteHierarchyText')?.value||'';let items;
 try{items=parsePastedHierarchy(value)}catch(e){alert(e.message);return}
 if(!items.length)return alert('Escribe al menos un tema');
 const selected=locate(id);if(!selected)return alert('Tema no encontrado');
 // Insert roots as siblings immediately after the selected topic, not as its children.
 // Entire pasted trees move together and existing topics remain untouched.
 closeModal();mutate(()=>{const position=siblings(id,findNote(current).nodes);if(position)position.nodes.splice(position.i+1,0,...items);findNote(current).updated=now()});
}

async function selectMishuFolder(){
 if(!window.showDirectoryPicker){alert('Tu navegador no admite carpetas locales. Usa Chrome o Edge en una conexión HTTPS.');return}
 try{
  const chosen=await window.showDirectoryPicker({mode:'readwrite',id:'mishu-library'});
  mishuFolderHandle=chosen.name.toLowerCase()==='mishu'?chosen:await chosen.getDirectoryHandle('mishu',{create:true});
  const file=await mishuFolderHandle.getFileHandle('autosave.json',{create:true});
  const existing=await (await file.getFile()).text();
  if(existing.trim()){
   try{const saved=JSON.parse(existing);if(valid(saved)&&confirm('¿Abrir la biblioteca guardada en esta carpeta?')){db=saved;localStorage.setItem(KEY,JSON.stringify(db));render()}}catch(e){console.warn('Mishu folder read',e)}
  }
  queueMishuFolderSave();updateMishuFolderStatus();
 }catch(e){if(e.name!=='AbortError')alert('No se pudo abrir la carpeta: '+e.message)}
}
function updateMishuFolderStatus(){

function queueMishuFolderSave(){if(!mishuFolderHandle)return;mishuWritePending=JSON.stringify(db);if(!mishuWriteActive)void drainMishuFolderSave()}
async function drainMishuFolderSave(){mishuWriteActive=true;try{while(mishuWritePending!==null){const payload=mishuWritePending;mishuWritePending=null;const file=await mishuFolderHandle.getFileHandle('autosave.json',{create:true});const writable=await file.createWritable();await writable.write(payload);await writable.close()}}catch(e){console.error('Mishu folder autosave failed',e);alert('Error al guardar en la carpeta Mishu: '+e.message)}finally{mishuWriteActive=false;if(mishuWritePending!==null)void drainMishuFolderSave()}}
const mishuOriginalSave=save;save=function(){mishuOriginalSave();queueMishuFolderSave()};
function setupBrowserFolderAccess(){if(window.MishuNative||window.pywebview||!window.showDirectoryPicker)return;
